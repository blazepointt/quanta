<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quanta — AI для работы со знаниями (Ultimate Edition)</title>
    <meta name="description" content="Quanta — бесплатная AI-платформа в браузере: чат с нейросетью, анализ документов и таблиц, генерация изображений и презентаций, deep research, перевод и код.">
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    
    <!-- Подсветка синтаксиса кода (Тема: Atom One Dark) -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/atom-one-dark.min.css">

    <style>
        /* ==========================================================================
           1. БАЗОВЫЕ ПЕРЕМЕННЫЕ И СБРОС (CORE VARIABLES & RESET)
           ========================================================================== */
        :root {
            --bg-primary: #0d0d0d;
            --bg-secondary: #141414;
            --bg-card: #1a1a1a;
            --bg-input: #1e1e1e;
            --bg-hover: #252525;
            --text-primary: #e8e8e8;
            --text-secondary: #888888;
            --text-muted: #555555;
            --accent: #6366f1;
            --accent-hover: #818cf8;
            --accent-glow: rgba(99, 102, 241, 0.3);
            --border: #262626;
            --border-light: #333333;
            --success: #22c55e;
            --warning: #f59e0b;
            --danger: #ef4444;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body, main {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            background: var(--bg-primary);
            color: var(--text-primary);
            min-height: 100vh;
            max-width: 100vw;
            overflow-x: hidden;
            line-height: 1.6;
        }
        
        /* Защита от переполнения блоков с контентом */
        .msg-content {
            white-space: normal;
            word-break: break-word;
            overflow-wrap: anywhere;
        }

        /* ==========================================================================
           2. АНИМАЦИИ И ФОН (ANIMATIONS & BACKGROUND)
           ========================================================================== */
        .particles {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 0;
            opacity: 0.4;
        }

        .particle {
            position: absolute;
            width: 2px;
            height: 2px;
            background: var(--accent);
            border-radius: 50%;
            animation: float 20s infinite linear;
        }

        @keyframes float {
            0% { transform: translateY(100vh) rotate(0deg); opacity: 0; }
            10% { opacity: 1; }
            90% { opacity: 1; }
            100% { transform: translateY(-100vh) rotate(720deg); opacity: 0; }
        }

        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .animate-in { animation: fadeInUp 0.6s ease-out forwards; }
        .delay-1 { animation-delay: 0.1s; }
        .delay-2 { animation-delay: 0.2s; }
        .delay-3 { animation-delay: 0.3s; }

        /* ==========================================================================
           3. НАВИГАЦИЯ И ШАПКА (HEADER & NAVIGATION)
           ========================================================================== */
        header {
            position: fixed;
            top: 0; left: 0; right: 0;
            z-index: 100;
            padding: 16px 32px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: rgba(13, 13, 13, 0.8);
            backdrop-filter: blur(20px);
            border-bottom: 1px solid var(--border);
        }

        .logo {
            display: flex; align-items: center; gap: 12px;
            font-size: 1.5rem; font-weight: 700; color: var(--text-primary); text-decoration: none;
        }

        .logo-icon {
            width: 36px; height: 36px;
            background: linear-gradient(135deg, var(--accent), #8b5cf6);
            border-radius: 10px; display: flex; align-items: center; justify-content: center;
            font-size: 1.2rem; font-weight: 700;
        }

        .nav-links { display: flex; gap: 8px; align-items: center; }
        .nav-link {
            padding: 8px 16px; border-radius: 8px; color: var(--text-secondary);
            text-decoration: none; font-size: 0.9rem; font-weight: 500; transition: all 0.2s;
        }
        .nav-link:hover { color: var(--text-primary); background: var(--bg-hover); }

        .header-actions { display: flex; align-items: center; gap: 10px; }
        .github-btn {
            display: flex; align-items: center; gap: 8px; padding: 8px 16px;
            border-radius: 8px; background: var(--bg-card); color: var(--text-primary);
            text-decoration: none; font-size: 0.9rem; font-weight: 500;
            border: 1px solid var(--border); transition: all 0.2s; cursor: pointer;
        }
        .github-btn:hover { background: var(--bg-hover); border-color: var(--border-light); }
        
        #puterAuthBtn.puter-signed-in {
            background: rgba(34, 197, 94, 0.12); border-color: rgba(34, 197, 94, 0.4); color: #4ade80;
        }

        /* ==========================================================================
           4. ГЛАВНЫЙ ЭКРАН И ВВОД (HERO & INPUT AREA)
           ========================================================================== */
        main { position: relative; z-index: 1; padding-top: 80px; }

        .hero {
            min-height: calc(100vh - 80px); display: flex; flex-direction: column;
            align-items: center; justify-content: center; padding: 40px 20px; text-align: center;
        }

        .hero-logo {
            font-size: 4rem; font-weight: 700; letter-spacing: -2px; margin-bottom: 8px;
            background: linear-gradient(135deg, #fff 0%, #888 100%);
            -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text;
        }

        .hero-subtitle { font-size: 1.1rem; color: var(--text-secondary); margin-bottom: 40px; font-weight: 400; }

        .input-container { width: 100%; max-width: 700px; margin-bottom: 24px; }
        
        .input-wrapper {
            background: var(--bg-card); border: 1px solid var(--border);
            border-radius: 16px; padding: 16px; transition: all 0.3s;
        }
        .input-wrapper:focus-within { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-glow); }

        .input-textarea {
            width: 100%; background: transparent; border: none; outline: none;
            color: var(--text-primary); font-size: 1rem; font-family: inherit;
            resize: none; min-height: 60px; max-height: 200px;
        }
        .input-textarea::placeholder { color: var(--text-muted); }

        .input-actions {
            display: flex; justify-content: space-between; align-items: center;
            margin-top: 12px; padding-top: 12px; border-top: 1px solid var(--border);
        }

        .input-left { display: flex; gap: 8px; }
        .icon-btn {
            width: 36px; height: 36px; border-radius: 8px; background: transparent; border: none;
            color: var(--text-secondary); cursor: pointer; display: flex; align-items: center;
            justify-content: center; transition: all 0.2s;
        }
        .icon-btn:hover { background: var(--bg-hover); color: var(--text-primary); }
        
        .send-btn {
            width: 36px; height: 36px; border-radius: 50%; background: var(--text-primary);
            border: none; color: var(--bg-primary); cursor: pointer; display: flex;
            align-items: center; justify-content: center; transition: all 0.2s;
        }
        .send-btn:hover { transform: scale(1.05); background: #fff; }

        .mode-selector {
            display: flex; align-items: center; gap: 6px; padding: 6px 12px;
            border-radius: 8px; background: transparent; border: none; color: var(--text-secondary);
            font-size: 0.85rem; cursor: pointer; transition: all 0.2s;
        }
        .mode-selector:hover { background: var(--bg-hover); color: var(--text-primary); }

        /* ПРЕВЬЮ ИЗОБРАЖЕНИЙ */
        .image-preview-bar {
            display: none; align-items: center; gap: 12px; padding: 8px 12px;
            background: var(--bg-input); border: 1px solid var(--border);
            border-radius: 10px; margin-bottom: 12px; text-align: left;
        }
        img[alt="Preview"]:not([src]) { display: none; }
        .image-preview-thumb { width: 48px; height: 48px; border-radius: 8px; object-fit: cover; border: 1px solid var(--border); }
        .image-preview-info { flex: 1; min-width: 0; }
        .image-preview-name { font-size: 0.85rem; font-weight: 500; color: var(--text-primary); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .image-preview-hint { font-size: 0.75rem; color: var(--text-secondary); }
        .image-preview-remove { background: transparent; border: none; color: var(--text-muted); cursor: pointer; padding: 4px; font-size: 1.1rem; line-height: 1; }
        .image-preview-remove:hover { color: var(--danger); }

        /* БЫСТРЫЕ ДЕЙСТВИЯ */
        .quick-actions { display: flex; flex-wrap: wrap; gap: 10px; justify-content: center; margin-bottom: 40px; }
        .quick-action {
            display: flex; align-items: center; gap: 8px; padding: 10px 18px; border-radius: 10px;
            background: var(--bg-card); border: 1px solid var(--border); color: var(--text-secondary);
            font-size: 0.9rem; cursor: pointer; transition: all 0.2s; text-decoration: none;
        }
        .quick-action:hover { background: var(--bg-hover); border-color: var(--border-light); color: var(--text-primary); transform: translateY(-1px); }
        .quick-action.active {
            background: var(--bg-hover); border-color: var(--accent);
            box-shadow: 0 0 12px var(--accent-glow); color: var(--text-primary); transform: translateY(-1px);
        }
        .quick-action svg { width: 18px; height: 18px; }

        /* ==========================================================================
           5. РАБОЧАЯ СРЕДА ЧАТА (WORKSPACE & MARKDOWN)
           ========================================================================== */
        .workspace {
            width: 100%; max-width: 700px; margin: 0 auto 32px; background: var(--bg-card);
            border: 1px solid var(--border); border-radius: 16px; text-align: left; overflow: hidden;
            display: none; /* Изначально скрыт */
        }

        .workspace-header {
            display: flex; justify-content: space-between; align-items: center;
            padding: 14px 18px; border-bottom: 1px solid var(--border);
            font-size: 0.9rem; font-weight: 600; color: var(--text-secondary);
        }

        .workspace-body { padding: 18px; max-height: 60vh; overflow-y: auto; scroll-behavior: smooth; }

        .msg { margin-bottom: 24px; display: flex; flex-direction: column; gap: 6px; }
        .msg-role { font-size: 0.75rem; color: var(--text-muted); font-weight: 600; text-transform: uppercase; letter-spacing: 0.5px; }
        .msg-user .msg-role { color: var(--accent-hover); }
        
        /* Стилизация контента Markdown */
        .msg-content { font-size: 0.95rem; line-height: 1.6; color: var(--text-primary); }
        .msg-content p { margin-bottom: 12px; }
        .msg-content p:last-child { margin-bottom: 0; }
        .msg-content ul, .msg-content ol { margin-bottom: 12px; padding-left: 20px; }
        .msg-content li { margin-bottom: 4px; }
        .msg-content h1, .msg-content h2, .msg-content h3 { margin-top: 16px; margin-bottom: 8px; color: #fff; }
        
        /* Таблицы Markdown */
        .msg-content table {
            border-collapse: collapse; width: 100%; font-size: 0.85rem; margin: 12px 0;
            background: var(--bg-input); border-radius: 8px; overflow: hidden;
        }
        .msg-content th, .msg-content td { border: 1px solid var(--border); padding: 8px 12px; text-align: left; }
        .msg-content th { background: var(--bg-hover); font-weight: 600; }
        
        /* Изображения внутри чата */
        .msg-content img { max-width: 100%; border-radius: 10px; margin-top: 8px; border: 1px solid var(--border); }

        /* КОДОВЫЕ БЛОКИ (IDE ВНЕШНИЙ ВИД) */
        .code-container {
            margin: 12px 0;
            border-radius: 10px;
            overflow: hidden;
            border: 1px solid var(--border);
            background: #282c34; /* Atom One Dark bg */
        }
        
        .code-header {
            display: flex; justify-content: space-between; align-items: center;
            background: #1e2227; padding: 6px 16px; font-size: 0.75rem; color: #abb2bf;
            border-bottom: 1px solid #181a1f;
        }

        .code-header .lang-badge { text-transform: uppercase; font-weight: 600; letter-spacing: 0.5px; }
        
        .code-header .code-actions { display: flex; gap: 8px; }
        
        .code-btn {
            background: transparent; border: 1px solid #4b5263; color: #abb2bf;
            padding: 4px 10px; border-radius: 6px; cursor: pointer; font-size: 0.75rem;
            transition: all 0.2s; display: flex; align-items: center; gap: 4px;
        }
        .code-btn:hover { background: #4b5263; color: #fff; }
        .code-btn.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
        .code-btn.primary:hover { background: var(--accent-hover); }

        .code-container pre { margin: 0; padding: 16px; overflow-x: auto; font-family: 'JetBrains Mono', monospace; font-size: 0.85rem; line-height: 1.5; }
        .msg-content p > code { background: var(--bg-hover); padding: 2px 6px; border-radius: 4px; font-family: 'JetBrains Mono', monospace; font-size: 0.85em; color: var(--accent-hover); }

        /* Элементы управления внутри чата */
        .ws-download { display: inline-block; margin-top: 10px; padding: 8px 14px; border-radius: 8px; background: var(--accent); color: #fff; text-decoration: none; font-size: 0.85rem; font-weight: 500; border: none; cursor: pointer; }
        .ws-download:hover { background: var(--accent-hover); }
        
        .ws-loading { display: flex; align-items: center; gap: 10px; color: var(--text-secondary); font-size: 0.9rem; }
        .spinner { width: 20px; height: 20px; border: 2px solid var(--border); border-top-color: var(--accent); border-radius: 50%; animation: spin 0.8s linear infinite; }
        
        /* Уведомления */
        .toast {
            position: fixed; bottom: 24px; right: 24px; padding: 12px 20px;
            background: var(--bg-card); border: 1px solid var(--border); border-radius: 12px;
            color: var(--text-primary); font-size: 0.9rem; z-index: 1000;
            transform: translateY(100px); opacity: 0; transition: all 0.3s cubic-bezier(0.68, -0.55, 0.265, 1.55);
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }
        .toast.show { transform: translateY(0); opacity: 1; }

        /* Скроллбары */
        ::-webkit-scrollbar { width: 8px; height: 8px; }
        ::-webkit-scrollbar-track { background: var(--bg-primary); }
        ::-webkit-scrollbar-thumb { background: var(--border-light); border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: var(--text-muted); }
    </style>
</head>
<body>
    <div class="particles" id="particles"></div>

    <!-- ШАПКА -->
    <header>
        <a href="#" class="logo">
            <div class="logo-icon">Q</div>
            <span>Quanta</span>
        </a>
        <div class="header-actions">
            <a href="https://github.com/blazepointt/quanta" target="_blank" class="github-btn">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor">
                    <path d="M12 0c-6.626 0-12 5.373-12 12 0 5.302 3.438 9.8 8.207 11.387.599.111.793-.261.793-.577v-2.234c-3.338.726-4.033-1.416-4.033-1.416-.546-1.387-1.333-1.756-1.333-1.756-1.089-.745.083-.729.083-.729 1.205.084 1.839 1.237 1.839 1.237 1.07 1.834 2.807 1.304 3.492.997.107-.775.418-1.305.762-1.604-2.665-.305-5.467-1.334-5.467-5.931 0-1.311.469-2.381 1.236-3.221-.124-.303-.535-1.524.117-3.176 0 0 1.008-.322 3.301 1.23.957-.266 1.983-.399 3.003-.404 1.02.005 2.047.138 3.006.404 2.291-1.552 3.297-1.23 3.297-1.23.653 1.653.242 2.874.118 3.176.77.84 1.235 1.911 1.235 3.221 0 4.609-2.807 5.624-5.479 5.921.43.372.823 1.102.823 2.222v3.293c0 .319.192.694.801.576 4.765-1.589 8.199-6.086 8.199-11.386 0-6.627-5.373-12-12-12z"/>
                </svg>
                GitHub
            </a>
            <button class="github-btn" id="puterAuthBtn" onclick="handlePuterAuthClick()" title="Войти в Puter, чтобы заработал AI">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <circle cx="12" cy="8" r="4"/>
                    <path d="M4 21v-1a7 7 0 0 1 7-7h2a7 7 0 0 1 7 7v1"/>
                </svg>
                <span id="puterAuthLabel">Войти в Puter</span>
            </button>
        </div>
    </header>

    <main>
        <section class="hero">
            <h1 class="hero-logo animate-in">QUANTA</h1>
            <p class="hero-subtitle animate-in delay-1">
                AI-платформа для работы со знаниями, генерации контента и разработки
            </p>

            <!-- ОБЛАСТЬ ВВОДА -->
            <div class="input-container animate-in delay-2">
                <div class="input-wrapper">
                    <div class="image-preview-bar" id="imagePreviewBar">
                        <img id="imagePreviewThumb" class="image-preview-thumb" alt="Preview">
                        <div class="image-preview-info">
                            <div class="image-preview-name" id="imagePreviewName">image.png</div>
                            <div class="image-preview-hint">Напишите запрос к изображению и нажмите Отправить</div>
                        </div>
                        <button class="image-preview-remove" onclick="removePendingImage()" title="Удалить фото">✕</button>
                    </div>

                    <textarea 
                        class="input-textarea" 
                        placeholder="Опишите задачу, напишите код, попросите нарисовать или сделайте презентацию..."
                        id="mainInput"
                        rows="3"
                    ></textarea>
                    
                    <div class="input-actions">
                        <div class="input-left">
                            <button class="icon-btn" title="Загрузить документ или датасет" onclick="triggerFileUpload()">
                                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                    <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
                                    <polyline points="17 8 12 3 7 8"/>
                                    <line x1="12" y1="3" x2="12" y2="15"/>
                                </svg>
                            </button>
                            <button class="icon-btn" title="Сгенерировать ИИ-картинку (DALL-E 3)" onclick="triggerImageGen()">
                                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                    <rect x="3" y="3" width="18" height="18" rx="2" ry="2"/>
                                    <circle cx="8.5" cy="8.5" r="1.5"/>
                                    <polyline points="21 15 16 10 5 21"/>
                                </svg>
                            </button>
                            <button class="icon-btn" id="voiceBtn" title="Голосовой ввод" onclick="startVoiceInput()">
                                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                    <path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"/>
                                    <path d="M19 10v2a7 7 0 0 1-14 0v-2"/>
                                    <line x1="12" y1="19" x2="12" y2="23"/>
                                    <line x1="8" y1="23" x2="16" y2="23"/>
                                </svg>
                            </button>
                        </div>
                        <div style="display: flex; align-items: center; gap: 12px;">
                            <button class="mode-selector" onclick="toggleModel()" title="Сменить модель ИИ">
                                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                    <polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"/>
                                </svg>
                                <span id="modeLabel">Быстрый</span>
                                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                    <polyline points="6 9 12 15 18 9"/>
                                </svg>
                            </button>
                            <button class="send-btn" onclick="handleSend()" title="Отправить запрос (Enter)">
                                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                    <line x1="22" y1="2" x2="11" y2="13"/>
                                    <polygon points="22 2 15 22 11 13 2 9 22 2"/>
                                </svg>
                            </button>
                        </div>
                    </div>
                </div>
            </div>

            <!-- БЫСТРЫЕ ШАБЛОНЫ -->
            <div class="quick-actions animate-in delay-3">
                <button class="quick-action" onclick="runQuickAction('cluster', this)">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M12 2v4M12 18v4M4.93 4.93l2.83 2.83M16.24 16.24l2.83 2.83M2 12h4M18 12h4M4.93 19.07l2.83-2.83M16.24 7.76l2.83-2.83"/></svg>
                    Кластер
                </button>
                <button class="quick-action" onclick="runQuickAction('slides', this)">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="2" y="3" width="20" height="14" rx="2"/><line x1="8" y1="21" x2="16" y2="21"/><line x1="12" y1="17" x2="12" y2="21"/></svg>
                    Слайды
                </button>
                <button class="quick-action" onclick="runQuickAction('research', this)">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/><line x1="11" y1="8" x2="11" y2="14"/><line x1="8" y1="11" x2="14" y2="11"/></svg>
                    Глубокое исследование
                </button>
                <button class="quick-action" onclick="runQuickAction('website', this)">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="2" y="3" width="20" height="14" rx="2"/><line x1="2" y1="8" x2="22" y2="8"/><line x1="6" y1="12" x2="6" y2="12"/><line x1="10" y1="12" x2="10" y2="12"/></svg>
                    Сайты
                </button>
                <button class="quick-action" onclick="if(setActiveQuickAction(this)) triggerFileUpload();">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/><polyline points="10 9 9 9 8 9"/></svg>
                    Документы
                </button>
                <button class="quick-action" onclick="runQuickAction('table', this)">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="2"/><line x1="3" y1="9" x2="21" y2="9"/><line x1="3" y1="15" x2="21" y2="15"/><line x1="9" y1="3" x2="9" y2="21"/><line x1="15" y1="3" x2="15" y2="21"/></svg>
                    Таблицы
                </button>
            </div>

            <!-- РАБОЧЕЕ ПРОСТРАНСТВО (ЧАТ) -->
            <div class="workspace" id="workspace">
                <div class="workspace-header">
                    <span id="workspaceTitle">Quanta AI</span>
                    <div style="display:flex; gap:6px;">
                        <button class="icon-btn" onclick="clearHistoryUI()" title="Очистить историю чата">🗑</button>
                        <button class="icon-btn" onclick="closeWorkspace()" title="Закрыть окно">✕</button>
                    </div>
                </div>
                <div class="workspace-body" id="workspaceBody">
                    <!-- Сообщения будут появляться здесь -->
                </div>
            </div>
        </section>
    </main>

    <!-- СКРЫТЫЙ ИНПУТ ДЛЯ ФАЙЛОВ -->
    <input type="file" id="fileInput" style="display:none" accept=".pdf,.docx,.txt,.md,.csv,.xlsx,.xls,image/*">
    <div class="toast" id="toast"></div>

    <!-- ==========================================================================
         БИБЛИОТЕКИ И ЗАВИСИМОСТИ (CDN)
         ========================================================================== -->
    <!-- AI Движок (Бесплатный бэкенд) -->
    <script src="https://js.puter.com/v2/"></script>
    
    <!-- Парсинг документов -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/mammoth/1.6.0/mammoth.browser.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    
    <!-- Визуализация и Презентации -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/pptxgenjs@3.12.0/dist/pptxgen.bundle.js"></script>

    <!-- Профессиональный рендер Markdown и Кода (НОВОЕ) -->
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>

    <!-- ==========================================================================
         ГЛАВНЫЙ JAVASCRIPT (ЛОГИКА ПРИЛОЖЕНИЯ)
         ========================================================================== -->
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            // Настройка Markdown парсера для красивого кода
            marked.setOptions({
                highlight: function(code, lang) {
                    const language = hljs.getLanguage(lang) ? lang : 'plaintext';
                    return hljs.highlight(code, { language }).value;
                },
                breaks: true, // Поддержка обычных переносов строк
                gfm: true     // GitHub Flavored Markdown
            });

            // 1. СОЗДАНИЕ ЧАСТИЦ НА ФОНЕ
            function createParticles() {
                const container = document.getElementById('particles');
                for (let i = 0; i < 50; i++) {
                    const particle = document.createElement('div');
                    particle.className = 'particle';
                    particle.style.left = Math.random() * 100 + '%';
                    particle.style.animationDelay = Math.random() * 20 + 's';
                    particle.style.animationDuration = (15 + Math.random() * 10) + 's';
                    container.appendChild(particle);
                }
            }
            createParticles();

            // 2. УВЕДОМЛЕНИЯ (TOASTS)
            window.showToast = function(message) {
                const toast = document.getElementById('toast');
                toast.textContent = message;
                toast.classList.add('show');
                setTimeout(() => toast.classList.remove('show'), 3000);
            }
// 3. ПАМЯТЬ ЧАТА (LOCAL STORAGE)
            let chatHistory = JSON.parse(localStorage.getItem('quanta_chat_history')) || [];
            
            function saveHistory() {
                localStorage.setItem('quanta_chat_history', JSON.stringify(chatHistory));
            }

            window.clearHistoryUI = function() {
                chatHistory = [];
                saveHistory();
                document.getElementById('workspaceBody').innerHTML = '';
                showToast('История чата очищена');
            }

            // Восстановление UI при перезагрузке
            function restoreUI() {
                if (chatHistory.length > 0) {
                    const ws = document.getElementById('workspace');
                    ws.style.display = 'block';
                    chatHistory.forEach(msg => {
                        // Не рендерим системные промпты в UI
                        if (msg.role === 'system') return;
                        addMessage(msg.role === 'user' ? 'user' : 'ai', renderText(msg.content));
                    });
                    
                    // Обновляем подсветку синтаксиса
                    setTimeout(() => {
                        document.querySelectorAll('pre code').forEach((block) => {
                            hljs.highlightElement(block);
                        });
                    }, 500);
                }
            }

            // 4. ЭКСПОРТ ФАЙЛОВ
            let _exportRegistry = {};
            let _exportCounter = 0;
            
            function registerExport(text) { 
                const id = 'exp' + (_exportCounter++); 
                _exportRegistry[id] = text; 
                return id; 
            }

            window.attachExport = function(el, text, filenameBase) {
                if (!text || !el) return;
                const id = registerExport(text);
                const bar = document.createElement('div');
                bar.style.cssText = 'margin-top:16px; padding-top:12px; border-top:1px solid var(--border); display:flex; gap:8px; flex-wrap:wrap;';
                bar.innerHTML = `
                    <button class="ws-download" style="border:none;cursor:pointer;" onclick="exportFile('${id}','txt','${filenameBase}')">📄 TXT</button>
                    <button class="ws-download" style="background:#2563eb;border:none;cursor:pointer;" onclick="exportFile('${id}','doc','${filenameBase}')">📝 Word</button>
                    <button class="ws-download" style="background:#ef4444;border:none;cursor:pointer;" onclick="exportFile('${id}','pdf','${filenameBase}')">📕 PDF</button>
                `;
                el.appendChild(bar);
            }

            window.exportFile = function(id, type, filenameBase) {
                const text = _exportRegistry[id];
                if (!text) return showToast('Ошибка: текст не найден');
                
                if (type === 'txt') {
                    triggerDownload(new Blob([text], { type: 'text/plain;charset=utf-8' }), filenameBase + '.txt');
                } else if (type === 'doc') {
                    const body = text.split('\n').map(p => '<p>' + escapeHtml(p) + '</p>').join('');
                    const html = '<html xmlns:o="urn:schemas-microsoft-com:office:office" xmlns:w="urn:schemas-microsoft-com:office:word" xmlns="http://www.w3.org/TR/REC-html40"><head><meta charset="utf-8"><title>Export</title></head><body>' + body + '</body></html>';
                    triggerDownload(new Blob(['\ufeff', html], { type: 'application/msword' }), filenameBase + '.doc');
                } else if (type === 'pdf') {
                    const win = window.open('', '_blank');
                    if (!win) return showToast('Снимите блокировку всплывающих окон');
                    win.document.write('<html><head><meta charset="utf-8"><title>' + escapeHtml(filenameBase) + '</title><style>body{font-family:Arial,sans-serif;padding:40px;line-height:1.6;white-space:pre-wrap;color:#111;}</style></head><body>' + escapeHtml(text) + '</body></html>');
                    win.document.close(); win.focus(); setTimeout(() => win.print(), 350);
                }
            }

            function triggerDownload(blob, filename) {
                const url = URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url; a.download = filename; document.body.appendChild(a);
                a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(url), 5000);
            }

            // 5. AI ДВИЖОК И МОДЕЛИ
            const MODELS = { 
                quick: 'gpt-4o-mini', 
                deep: 'gpt-4o', 
                ultra: 'claude-3-opus' // Самая мощная модель без лимитов
            };
            let currentMode = 'quick';
            const modeNames = { quick: 'Быстрый', deep: 'Глубокий', ultra: 'Ультра (Opus)' };

            window.toggleModel = function() {
                const label = document.getElementById('modeLabel');
                if (currentMode === 'quick') { 
                    currentMode = 'deep'; 
                } else if (currentMode === 'deep') {
                    currentMode = 'ultra';
                    label.style.color = '#8b5cf6';
                    label.style.fontWeight = 'bold';
                    label.style.textShadow = '0 0 8px rgba(139, 92, 246, 0.5)';
                } else {
                    currentMode = 'quick';
                    label.style.color = '';
                    label.style.fontWeight = '';
                    label.style.textShadow = '';
                }
                label.textContent = modeNames[currentMode];
                showToast(`Активирован: ${modeNames[currentMode]}`);
            }

            // Авторизация Puter
            async function refreshPuterAuthUI() {
                const btn = document.getElementById('puterAuthBtn');
                const label = document.getElementById('puterAuthLabel');
                if (typeof puter === 'undefined') return;
                try {
                    if (await puter.auth.isSignedIn()) { 
                        btn.classList.add('puter-signed-in'); 
                        label.textContent = 'Puter подключён'; 
                    } else { 
                        btn.classList.remove('puter-signed-in'); 
                        label.textContent = 'Войти в Puter'; 
                    }
                } catch (e) {}
            }

            window.handlePuterAuthClick = async function() {
                if (typeof puter === 'undefined') return showToast('Сеть недоступна');
                try {
                    if (await puter.auth.isSignedIn()) return showToast('Уже подключён');
                    await puter.auth.signIn(); 
                    showToast('AI успешно активирован!');
                } catch (e) { showToast('Отмена входа'); } 
                finally { refreshPuterAuthUI(); }
            }
            setTimeout(refreshPuterAuthUI, 800);

            let _puterHintShown = false;
            function maybeShowPuterHint() { 
                if (!_puterHintShown) { 
                    _puterHintShown = true; 
                    showToast('Разрешите всплывающее окно для Puter (это бесплатно)'); 
                } 
            }

            function withTimeout(promise, ms, label) {
                let timer;
                const timeout = new Promise((_, reject) => {
                    timer = setTimeout(() => reject(new Error(`${label} превысил таймаут ожидания (${Math.round(ms / 1000)} сек)`)), ms);
                });
                return Promise.race([promise, timeout]).finally(() => clearTimeout(timer));
            }

            async function askAI(prompt, opts = {}) {
                if (typeof puter === 'undefined') throw new Error('Шлюз Puter.js заблокирован. Отключите AdBlock.');
                maybeShowPuterHint();
                
                const model = opts.model || MODELS[currentMode];
                let payload;
                
                if (opts.useHistory) {
                    payload = [...chatHistory, { role: 'user', content: prompt }];
                } else {
                    payload = prompt;
                }

                const response = await withTimeout(puter.ai.chat(payload, { model }), 45000, 'Ответ от нейросети');
                const answer = typeof response === 'string' ? response : (response?.message?.content || response?.text || JSON.stringify(response));
                
                if (opts.useHistory) {
                    chatHistory.push({ role: 'user', content: prompt });
                    chatHistory.push({ role: 'assistant', content: answer });
                    if (chatHistory.length > 30) chatHistory = chatHistory.slice(-30); // Храним последние 30 сообщений
                    saveHistory();
                }
                return answer;
            }

            // 6. УПРАВЛЕНИЕ ИНТЕРФЕЙСОМ ЧАТА И MARKDOWN
            window.openWorkspace = function(title) {
                const ws = document.getElementById('workspace');
                document.getElementById('workspaceTitle').textContent = title || 'Quanta AI';
                ws.style.display = 'block'; 
                ws.scrollIntoView({ behavior: 'smooth', block: 'center' });
            }

            window.closeWorkspace = function() {
                document.getElementById('workspace').style.display = 'none';
                document.querySelectorAll('.quick-action').forEach(el => el.classList.remove('active'));
            }

            function addMessage(role, contentHtml) {
                const body = document.getElementById('workspaceBody');
                const div = document.createElement('div');
                div.className = 'msg msg-' + role;
                div.innerHTML = `<div class="msg-role">${role === 'user' ? 'Вы' : 'Quanta'}</div><div class="msg-content">${contentHtml}</div>`;
                body.appendChild(div); 
                body.scrollTop = body.scrollHeight; 
                return div.querySelector('.msg-content');
            }

            function addLoading(label) {
                return addMessage('ai', `<div class="ws-loading"><div class="spinner"></div>${label || 'Думаю...'}</div>`);
            }

            function escapeHtml(str) { 
                return String(str).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); 
            }

            // Профессиональный рендер: Сначала Markdown, потом обертки с кнопками
            let codeCounter = 0;
            function renderText(text) {
                // Используем мощь marked.js для парсинга
                let html = marked.parse(text);
                
                // Ищем все блоки <pre><code class="language-xyz"> и добавляем красивую шапку IDE
                html = html.replace(/<pre><code class="language-(\w+)">([\s\S]*?)<\/code><\/pre>/g, (match, lang, code) => {
                    const id = 'code_' + (++codeCounter);
                    const ext = lang || 'txt';
                    return `
                    <div class="code-container">
                        <div class="code-header">
                            <span class="lang-badge">${ext}</span>
                            <div class="code-actions">
                                <button class="code-btn" onclick="navigator.clipboard.writeText(document.getElementById('${id}').innerText); showToast('Скопировано!')">📋 Копировать</button>
                                <button class="code-btn primary" onclick="downloadCodeBlock('${id}', '${ext}')">💾 Скачать файл</button>
                            </div>
                        </div>
                        <pre><code id="${id}" class="hljs language-${ext}">${code}</code></pre>
                    </div>`;
                });

                // Обработка блоков кода без указания языка
                html = html.replace(/<pre><code>([\s\S]*?)<\/code><\/pre>/g, (match, code) => {
                    const id = 'code_' + (++codeCounter);
                    return `
                    <div class="code-container">
                        <div class="code-header">
                            <span class="lang-badge">TEXT</span>
                            <div class="code-actions">
                                <button class="code-btn primary" onclick="downloadCodeBlock('${id}', 'txt')">💾 Сохранить</button>
                            </div>
                        </div>
                        <pre><code id="${id}">${code}</code></pre>
                    </div>`;
                });

                return html;
            }

            window.downloadCodeBlock = function(id, ext) {
                const codeEl = document.getElementById(id);
                if(!codeEl) return;
                const code = codeEl.innerText || codeEl.textContent;
                const filename = 'quanta_script.' + (ext === 'txt' ? 'txt' : ext);
                triggerDownload(new Blob([code], { type: 'text/plain;charset=utf-8' }), filename);
                showToast(`Файл ${filename} успешно сохранен!`);
            }

            // 7. ОБРАБОТКА ВВОДА И ТРИГГЕРЫ
            window.pendingImage = null;

            function setPendingImage(file, dataUrl) {
                window.pendingImage = { file, dataUrl, name: file.name };
                document.getElementById('imagePreviewThumb').src = dataUrl;
                document.getElementById('imagePreviewName').textContent = file.name;
                document.getElementById('imagePreviewBar').style.display = 'flex';
                document.getElementById('mainInput').focus();
            }

            window.removePendingImage = function() {
                window.pendingImage = null;
                document.getElementById('imagePreviewBar').style.display = 'none';
                document.getElementById('imagePreviewThumb').removeAttribute('src');
            }

            window.setActiveQuickAction = function(btn) {
                const isActive = btn && btn.classList.contains('active');
                document.querySelectorAll('.quick-action').forEach(el => el.classList.remove('active'));
                if (btn && !isActive) {
                    btn.classList.add('active');
                    return true;
                }
                return false;
            }

            window.triggerImageGen = function() {
                const input = document.getElementById('mainInput');
                if (!input.value.toLowerCase().startsWith('нарисуй')) {
                    input.value = 'Нарисуй ' + input.value;
                }
                input.focus();
                showToast('Напишите, что вы хотите увидеть!');
            }

            // --- ОСНОВНАЯ ФУНКЦИЯ ОТПРАВКИ ---
            window.handleSend = async function() {
                const input = document.getElementById('mainInput');
                const text = input.value.trim();
                const textLower = text.toLowerCase();

                // Сценарий 1: Анализ фото
                if (window.pendingImage) {
                    const imgData = window.pendingImage;
                    removePendingImage(); 
                    input.value = '';
                    openWorkspace('Vision AI');
                    addMessage('user', `<img src="${imgData.dataUrl}" style="max-height:180px;margin-bottom:12px;"><br>${renderText(text ? text : 'Проанализируй это изображение')}`);
                    
                    const loadingEl = addLoading('Изучаю пиксели...');
                    try {
                        const answer = await withTimeout(puter.ai.chat(text || 'Опиши детально это фото', imgData.dataUrl, false, { model: MODELS.ultra }), 45000, 'Vision AI');
                        const resultText = typeof answer === 'string' ? answer : (answer?.message?.content || answer?.text);
                        loadingEl.innerHTML = renderText(resultText);
                        attachExport(loadingEl, resultText, 'quanta-vision');
                    } catch (e) { loadingEl.innerHTML = `⚠️ <b>Критическая ошибка:</b> ${escapeHtml(e.message)}`; }
                    return;
                }

                if (!text) return showToast('Поле ввода пустое');

                // Сценарий 2: Триггер Слайдов
                if (textLower.includes('презентаци') || textLower.includes('слайды')) {
                    const slidesBtn = Array.from(document.querySelectorAll('.quick-action')).find(el => el.textContent.includes('Слайды'));
                    document.querySelectorAll('.quick-action').forEach(el => el.classList.remove('active'));
                    if(slidesBtn) slidesBtn.classList.add('active');
                    return handleSlides(text);
                }

                // Сценарий 3: Триггер Генерации DALL-E 3
                if (textLower.startsWith('нарисуй') || textLower.startsWith('сгенерируй') || textLower.startsWith('сделай фото')) {
                    openWorkspace('Студия DALL-E 3');
                    addMessage('user', renderText(text)); 
                    input.value = '';
                    const loadingEl = addLoading('🎨 Синтезирую изображение...');
                    try {
                        maybeShowPuterHint();
                        const imgEl = await withTimeout(puter.ai.txt2img(text), 45000, 'Генерация DALL-E');
                        const src = imgEl?.src || (typeof imgEl === 'string' ? imgEl : null);
                        if (!src) throw new Error('API вернул пустой ответ');
                        loadingEl.innerHTML = `
                            <img src="${src}" alt="Generated Art" style="width:100%; max-width:512px; border-radius:12px; margin-top:8px; box-shadow: 0 4px 15px rgba(0,0,0,0.3);">
                            <br>
                            <a class="ws-download" href="${src}" download="quanta-art.png" target="_blank" style="margin-top:16px;">💾 Скачать оригинал</a>
                        `;
                    } catch (e) { loadingEl.innerHTML = `⚠️ <b>Ошибка генерации:</b> ${escapeHtml(e.message)}`; }
                    return;
                }

                // Сценарий 4: Обычный Чат (С памятью и кодом)
                openWorkspace('Чат с Quanta');
                addMessage('user', renderText(text)); 
                input.value = '';
                
                const loadingEl = addLoading('Формирую архитектуру ответа...');
                try {
                    // Строгий промпт для Opus: никакого обрыва кода
                    const systemPrompt = "Ты — элитный Senior AI. Твоя задача писать ИДЕАЛЬНЫЙ, ПОЛНЫЙ и РАБОЧИЙ код. Категорически запрещено использовать комментарии вроде '// ...остальной код...' или обрывать логику. Если пишешь код, выдавай его целиком от первой до последней строки в блоках markdown.";
                    let finalPrompt = text;
                    
                    if (currentMode === 'ultra') {
                        finalPrompt = systemPrompt + "\n\nЗАДАЧА ОТ ПОЛЬЗОВАТЕЛЯ:\n" + text;
                    }
                    
                    const answer = await askAI(finalPrompt, { useHistory: true });
                    loadingEl.innerHTML = renderText(answer); 
                    attachExport(loadingEl, answer, 'quanta-response');
                    
                    // Обновляем подсветку синтаксиса в новых блоках
                    document.querySelectorAll('pre code').forEach((block) => {
                        hljs.highlightElement(block);
                    });

                } catch (e) { loadingEl.innerHTML = `⚠️ <b>Системный сбой:</b> ${escapeHtml(e.message)}`; }
            }

            // 8. БЫСТРЫЕ ДЕЙСТВИЯ (ШАБЛОНЫ)
            window.runQuickAction = async function(kind, btnElement) {
                if (!setActiveQuickAction(btnElement)) {
                    document.getElementById('mainInput').value = '';
                    return; 
                }

                const input = document.getElementById('mainInput');
                const text = input.value.trim();

                if (kind === 'cluster') return void handleClusterAnalysis(text);
                if (kind === 'slides') return void handleSlides(text);
                if (kind === 'research') return void handleResearch(text);
                if (kind === 'website') return void handleWebsite(text);
                if (kind === 'image') {
                    input.value = "Нарисуй " + text;
                    input.focus();
                    return;
                }
                if (kind === 'code') return void handleGenericMode(text, 'code', 'Режим Программирования', 'Ты Senior Engineer. Пиши полный, безошибочный код без сокращений в markdown-блоках. Запрос: ');
                if (kind === 'translate') return void handleGenericMode(text, 'translate', 'Умный перевод', 'Переведи текст сохраняя форматирование: ');
                if (kind === 'table') return void triggerFileUpload();
            }

            async function handleGenericMode(text, kind, title, sys) {
                if (!text) { showToast('Сначала введите текст задачи'); document.getElementById('mainInput').focus(); return; }
                openWorkspace(title); 
                addMessage('user', renderText(text)); 
                document.getElementById('mainInput').value = '';
                
                const loadingEl = addLoading('Запускаю алгоритмы...');
                try { 
                    const answer = await askAI(sys + text, { model: MODELS.ultra }); 
                    loadingEl.innerHTML = renderText(answer); 
                    attachExport(loadingEl, answer, `quanta-${kind}`); 
                    document.querySelectorAll('pre code').forEach(hljs.highlightElement);
                } catch (e) { loadingEl.innerHTML = `⚠️ <b>Ошибка:</b> ${escapeHtml(e.message)}`; }
            }

            async function handleResearch(text) {
                if (!text) { showToast('Введите тему для исследования'); document.getElementById('mainInput').focus(); return; }
                openWorkspace('Глубокое исследование (Deep Research)'); 
                addMessage('user', renderText(text)); 
                document.getElementById('mainInput').value = '';
                
                const loadingEl = addLoading('Анализирую семантическое ядро темы...');
                try {
                    const planRaw = await askAI(`Разбей тему на 4 ключевых вопроса для глубокого анализа. Ответь ТОЛЬКО нумерованным списком. Тема: ${text}`, { model: MODELS.ultra });
                    const subqs = planRaw.split('\n').map(s => s.replace(/^[-*\d.\s]+/, '').trim()).filter(Boolean).slice(0, 4);
                    
                    let report = `### План исследования:\n` + subqs.map((q, i) => `${i+1}. ${q}`).join('\n') + `\n\n---\n\n`;
                    loadingEl.innerHTML = renderText(report) + '<div class="ws-loading"><div class="spinner"></div>Собираю данные по подтемам...</div>';

                    for (const q of subqs) {
                        const answer = await askAI(`Развернуто ответь на вопрос в рамках темы "${text}": ${q}`, { model: MODELS.ultra });
                        report += `### ${q}\n${answer}\n\n---\n\n`;
                        loadingEl.innerHTML = renderText(report) + '<div class="ws-loading"><div class="spinner"></div>Собираю данные по подтемам...</div>';
                    }
                    
                    const summary = await askAI(`Напиши мощное итоговое заключение на базе этого исследования. Тема: ${text}`, { model: MODELS.ultra });
                    report += `### Заключение\n${summary}`;
                    
                    loadingEl.innerHTML = renderText(report); 
                    attachExport(loadingEl, report, 'quanta-research');
                } catch (e) { loadingEl.innerHTML = `⚠️ <b>Ошибка:</b> ${escapeHtml(e.message)}`; }
            }

            async function handleWebsite(text) {
                let url = text;
                if (!url || !/^https?:\/\//i.test(url)) { url = prompt('Вставьте валидный URL (https://...):', text || 'https://'); if (!url) return; }
                openWorkspace('Веб-сканер'); 
                addMessage('user', renderText(url)); 
                document.getElementById('mainInput').value = '';
                
                const loadingEl = addLoading('Скрейпинг страницы...');
                try {
                    const proxyUrl = 'https://api.allorigins.win/raw?url=' + encodeURIComponent(url);
                    const controller = new AbortController(); 
                    const t = setTimeout(() => controller.abort(), 20000);
                    
                    const res = await fetch(proxyUrl, { signal: controller.signal }); 
                    clearTimeout(t);
                    if (!res.ok) throw new Error(`Сервер вернул статус ${res.status}`);
                    
                    const html = await res.text(); 
                    const doc = new DOMParser().parseFromString(html, 'text/html');
                    doc.querySelectorAll('script, style, noscript, svg, img, nav, footer').forEach(el => el.remove());
                    
                    const text2 = (doc.body ? doc.body.innerText : html).replace(/\n{3,}/g, '\n\n').trim().slice(0, 10000); // Берем до 10к символов
                    
                    loadingEl.innerHTML = '<div class="ws-loading"><div class="spinner"></div>Анализ семантики...</div>';
                    const answer = await askAI(`Сделай подробную выжимку текста (основные тезисы, факты). Текст с сайта:\n\n${text2}`, { model: MODELS.ultra });
                    
                    loadingEl.innerHTML = renderText(answer); 
                    attachExport(loadingEl, answer, 'quanta-web-summary');
                } catch (e) { loadingEl.innerHTML = `⚠️ <b>Сбой прокси:</b> ${escapeHtml(e.message)}`; }
            }

            async function handleSlides(text) {
                if (!text) { showToast('Введите тему презентации'); document.getElementById('mainInput').focus(); return; }
                openWorkspace('Генератор Слайдов PPTX'); 
                addMessage('user', renderText(text)); 
                document.getElementById('mainInput').value = '';
                
                const loadingEl = addLoading('Формирую структуру JSON (Model: Ultra)...');
                try {
                    const raw = await askAI(`Сгенерируй структуру презентации на тему "${text}". 
ВЕРНИ ТОЛЬКО ЧИСТЫЙ JSON без markdown-кавычек. Формат:
{
  "title": "Название",
  "slides": [
    { "title": "Слайд 1", "bullets": ["Текст 1", "Текст 2", "Текст 3"] }
  ]
}
Обязательно 6-8 слайдов. Никаких слов "Вот ваш JSON".`, { model: MODELS.ultra });
                    
                    const jsonMatch = raw.match(/\{[\s\S]*\}/);
                    if (!jsonMatch) throw new Error('Нейросеть нарушила формат JSON');
                    const data = JSON.parse(jsonMatch[0]);

                    const pptx = new PptxGenJS();
                    
                    // Титульный слайд
                    const titleSlide = pptx.addSlide(); 
                    titleSlide.background = { color: '0A0A0A' };
                    titleSlide.addText(data.title || text, { x: 0.5, y: 2, w: 9, h: 1.5, fontSize: 44, bold: true, color: 'FFFFFF', align: 'center' });

                    // Контентные слайды
                    (data.slides || []).forEach(s => {
                        const slide = pptx.addSlide(); 
                        slide.background = { color: '121212' };
                        
                        // Заголовок слайда с градиентным эффектом (фиолетовый)
                        slide.addShape(pptx.ShapeType.rect, { x: 0.5, y: 0.3, w: 9, h: 1, fill: '1E1E2E' });
                        slide.addText(s.title || '', { x: 0.8, y: 0.4, w: 8.4, h: 0.8, fontSize: 28, bold: true, color: 'A78BFA' });
                        
                        // Буллиты
                        slide.addText((s.bullets || []).map(b => ({ text: b, options: { bullet: { type: 'number' }, breakLine: true } })), 
                            { x: 0.8, y: 1.6, w: 8.4, h: 3.5, fontSize: 18, color: 'E2E8F0', lineSpacing: 32 }
                        );
                    });

                    // Безопасный экспорт blob
                    const blob = await pptx.write({ outputType: 'blob' });
                    const url = URL.createObjectURL(blob);
                    
                    loadingEl.innerHTML = `
                        <div style="background:var(--bg-input); padding:20px; border-radius:12px; border:1px solid var(--success); text-align:center;">
                            <div style="font-size:3rem; margin-bottom:10px;">📊</div>
                            <h3 style="color:var(--success); margin-bottom:8px;">Презентация успешно создана!</h3>
                            <p style="color:var(--text-secondary); margin-bottom:16px;"><b>Тема:</b> ${escapeHtml(data.title || text)} (${(data.slides || []).length} слайдов)</p>
                            <a class="ws-download" href="${url}" download="Quanta_${text.replace(/\s+/g, '_').substring(0,20)}.pptx" style="font-size:1rem; padding:12px 24px; background:var(--success);">📥 Скачать файл .PPTX</a>
                        </div>
                    `;
                } catch (e) { loadingEl.innerHTML = `⚠️ <b>Ошибка компиляции слайдов:</b> ${escapeHtml(e.message)}`; }
            }

            // 9. АНАЛИЗ ФАЙЛОВ И ТАБЛИЦ (РАСШИРЕННЫЙ)
            window.triggerFileUpload = function() { document.getElementById('fileInput').click(); }

            document.getElementById('fileInput').addEventListener('change', async function (e) {
                const file = e.target.files[0]; 
                if (!file) return;
                
                const ext = file.name.split('.').pop().toLowerCase(); 
                e.target.value = ''; // Сброс инпута
                
                const imageExts = ['png', 'jpg', 'jpeg', 'gif', 'webp', 'bmp'];
                
                if (imageExts.includes(ext) || file.type.startsWith('image/')) {
                    const dataUrl = await fileToDataURL(file); 
                    setPendingImage(file, dataUrl); 
                    showToast('Изображение готово к анализу');
                } else if (['csv', 'xlsx'].includes(ext)) { 
                    await handleSpreadsheet(file);
                } else if (['pdf', 'docx', 'txt', 'md'].includes(ext)) { 
                    await handleDocument(file, ext);
                } else { 
                    showToast('Критическая ошибка: неподдерживаемый формат'); 
                }
            });

            function fileToDataURL(file) { 
                return new Promise((r, j) => { 
                    const reader = new FileReader(); 
                    reader.onload = () => r(reader.result); 
                    reader.onerror = j; 
                    reader.readAsDataURL(file); 
                }); 
            }

            async function extractTextFromFile(file, ext) {
                if (ext === 'txt' || ext === 'md') return await file.text();
                
                if (ext === 'pdf') {
                    // Используем стабильный CDN для PDF.js worker
                    pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
                    const pdf = await pdfjsLib.getDocument({ data: await file.arrayBuffer() }).promise;
                    let full = ''; 
                    for (let i = 1; i <= pdf.numPages; i++) {
                        const page = await pdf.getPage(i);
                        const content = await page.getTextContent();
                        full += content.items.map(it => it.str).join(' ') + '\n';
                    }
                    return full;
                }
                
                if (ext === 'docx') {
                    const result = await mammoth.extractRawText({ arrayBuffer: await file.arrayBuffer() });
                    return result.value;
                }
                return '';
            }

            async function handleDocument(file, ext) {
                openWorkspace('Doc Parser AI'); 
                addMessage('user', `📄 Загружен документ: <b>${escapeHtml(file.name)}</b>`);
                
                const loadingEl = addLoading('Извлечение текста...');
                try {
                    let content = (await extractTextFromFile(file, ext)).trim().slice(0, 15000); // Берем до 15к символов
                    if (!content) throw new Error('Документ пуст или защищен паролем');
                    
                    loadingEl.innerHTML = '<div class="ws-loading"><div class="spinner"></div>Анализ семантики...</div>';
                    
                    const prompt = `Проанализируй этот документ. Сделай структурированную выжимку:\n1. Главная мысль (2 предложения)\n2. Ключевые тезисы (списком)\n3. Важные цифры и факты (если есть).\n\nТекст:\n${content}`;
                    const answer = await askAI(prompt, { model: MODELS.ultra });
                    
                    loadingEl.innerHTML = renderText(answer); 
                    attachExport(loadingEl, answer, `Summary_${file.name}`);
                } catch (e) { loadingEl.innerHTML = `⚠️ <b>Ошибка парсера:</b> ${escapeHtml(e.message)}`; }
            }

            async function handleSpreadsheet(file) {
                openWorkspace('Data Science Engine');
                addMessage('user', `📊 Загружена таблица: <b>${escapeHtml(file.name)}</b>`);
                const loadingEl = addLoading('Парсинг ячеек...');
                
                try {
                    let rows = [];
                    if (file.name.toLowerCase().endsWith('.csv')) {
                        rows = Papa.parse(await file.text(), { header: true, skipEmptyLines: true, dynamicTyping: true }).data;
                    } else {
                        const wb = XLSX.read(await file.arrayBuffer(), { type: 'array' });
                        rows = XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]], { defval: null });
                    }
                    if (!rows.length) throw new Error('Таблица не содержит данных');

                    // Поиск числовых колонок для анализа
                    const columns = Object.keys(rows[0]);
                    const numericCols = columns.filter(c => rows.every(r => typeof r[c] === 'number' || r[c] == null));

                    // Сбор статистики
                    const stats = {};
                    numericCols.forEach(c => {
                        const vals = rows.map(r => r[c]).filter(v => typeof v === 'number');
                        if (!vals.length) return;
                        const sum = vals.reduce((a, b) => a + b, 0);
                        const sorted = [...vals].sort((a, b) => a - b);
                        stats[c] = {
                            count: vals.length, 
                            mean: (sum / vals.length).toFixed(2), 
                            min: sorted[0],
                            max: sorted[sorted.length - 1], 
                            median: sorted[Math.floor(sorted.length / 2)]
                        };
                    });

                    // Рендер таблицы статистики
                    let statsHtml = `<p><b>Анализ размерности:</b> Строк: ${rows.length} | Столбцов: ${columns.length}</p><br>`;
                    statsHtml += '<table><tr><th>Метрика</th><th>Среднее</th><th>Мин.</th><th>Медиана</th><th>Макс.</th></tr>';
                    Object.entries(stats).forEach(([c, s]) => { 
                        statsHtml += `<tr><td><b>${escapeHtml(c)}</b></td><td>${s.mean}</td><td>${s.min}</td><td>${s.median}</td><td>${s.max}</td></tr>`; 
                    });
                    statsHtml += '</table>';

                    let chartHtml = '';
                    
                    // Если есть 2 числовые колонки - строим ML График (K-Means)
                    if (numericCols.length >= 2) {
                        const [cx, cy] = numericCols;
                        const points = rows.map(r => [r[cx], r[cy]]).filter(p => typeof p[0] === 'number' && typeof p[1] === 'number');
                        
                        // Алгоритм кластеризации
                        const clusters = kMeans(points, Math.min(3, points.length));
                        const canvasId = 'chart_' + Date.now();
                        
                        chartHtml = `
                            <div style="background:#1e1e1e; padding:16px; border-radius:12px; margin-top:16px;">
                                <h4 style="margin-bottom:12px; color:#a78bfa;">ML Кластеризация (K-Means)</h4>
                                <canvas id="${canvasId}" height="220"></canvas>
                            </div>
                        `;
                        loadingEl.innerHTML = statsHtml + chartHtml + '<div class="ws-loading" style="margin-top:16px;"><div class="spinner"></div>Нейросеть ищет аномалии...</div>';
                        
                        setTimeout(() => renderClusterChart(canvasId, points, clusters, cx, cy), 50);
                    } else {
                        loadingEl.innerHTML = statsHtml + '<div class="ws-loading" style="margin-top:16px;"><div class="spinner"></div>Нейросеть ищет инсайты...</div>';
                    }

                    // Генерация ИИ-инсайтов
                    const insightsPrompt = `Вот математическая статистика по датасету (${rows.length} строк): ${JSON.stringify(stats)}. Выведи 3 самых интересных закономерности или инсайта бизнес-языком.`;
                    const insights = await askAI(insightsPrompt, { model: MODELS.ultra });
                    
                    loadingEl.innerHTML = statsHtml + chartHtml + '<br><h3>ИИ-Инсайты</h3>' + renderText(insights);
                    
                    if (chartHtml) setTimeout(() => renderClusterChart(loadingEl.querySelector('canvas').id, null, null, null, null, true), 60);
                    
                    // Кнопка экспорта XLSX
                    const xlsxBtn = document.createElement('button');
                    xlsxBtn.className = 'ws-download'; 
                    xlsxBtn.style.cssText = 'border:none; cursor:pointer; background:#10b981; margin-top:16px; width:100%;';
                    xlsxBtn.textContent = '📊 Выгрузить полный отчет в Excel (.xlsx)';
                    xlsxBtn.onclick = () => downloadStatsXlsx(rows, stats, 'Quanta_Analytics');
                    loadingEl.appendChild(xlsxBtn);

                } catch (e) { loadingEl.innerHTML = `⚠️ <b>Data Error:</b> ${escapeHtml(e.message)}`; }
            }

            async function handleClusterAnalysis(text) {
                openWorkspace('Менеджер Кластеров'); 
                addMessage('user', renderText(text || 'Проведи кластерный анализ')); 
                document.getElementById('mainInput').value = '';
                const loadingEl = addLoading('Вычисляю...');
                try {
                    const prompt = text ? `Опиши процесс кластеризации (K-means) для задачи: ${text}. Укажи признаки.` : 'Объясни математику алгоритма K-means простыми словами и предложи пользователю загрузить Excel/CSV.';
                    const answer = await askAI(prompt, { model: MODELS.ultra });
                    loadingEl.innerHTML = renderText(answer); 
                    attachExport(loadingEl, answer, 'quanta-cluster-logic');
                } catch (e) { loadingEl.innerHTML = `⚠️ ${escapeHtml(e.message)}`; }
            }

            // Математика K-Means
            function kMeans(points, k) {
                let centroids = points.slice(0, k).map(p => [...p]);
                let assignments = new Array(points.length).fill(0);
                
                for (let iter = 0; iter < 20; iter++) {
                    assignments = points.map(p => {
                        let best = 0, bestDist = Infinity;
                        centroids.forEach((c, i) => { 
                            const d = (p[0]-c[0])**2 + (p[1]-c[1])**2; 
                            if(d < bestDist){ bestDist=d; best=i; }
                        });
                        return best;
                    });
                    centroids = centroids.map((c, i) => {
                        const m = points.filter((_, idx) => assignments[idx] === i);
                        return m.length ? [m.reduce((a, p) => a+p[0], 0)/m.length, m.reduce((a, p) => a+p[1], 0)/m.length] : c;
                    });
                }
                return assignments;
            }

            let _lastChartCache = null;
            function renderClusterChart(canvasId, points, clusters, cx, cy, reuse) {
                const canvas = document.getElementById(canvasId); 
                if (!canvas) return;
                
                if (points) _lastChartCache = { points, clusters, cx, cy };
                const data = _lastChartCache; 
                if (!data) return;
                
                // Киберпанк-цвета
                const colors = ['#a78bfa', '#34d399', '#fbbf24', '#f87171', '#2dd4bf'];
                const datasets = [...new Set(data.clusters)].map(cl => ({
                    label: `Группа ${cl + 1}`,
                    data: data.points.filter((_, i) => data.clusters[i] === cl).map(p => ({ x: p[0], y: p[1] })),
                    backgroundColor: colors[cl % colors.length],
                    pointRadius: 5,
                    pointHoverRadius: 8
                }));
                
                new Chart(canvas, {
                    type: 'scatter', 
                    data: { datasets },
                    options: { 
                        responsive: true, 
                        scales: { 
                            x: { title: { display: true, text: data.cx, color: '#9ca3af' }, ticks: { color: '#9ca3af' }, grid: { color: '#374151' } }, 
                            y: { title: { display: true, text: data.cy, color: '#9ca3af' }, ticks: { color: '#9ca3af' }, grid: { color: '#374151' } } 
                        }, 
                        plugins: { legend: { labels: { color: '#e5e7eb', font: { family: 'Inter' } } } } 
                    }
                });
            }

            function downloadStatsXlsx(rows, stats, filenameBase) {
                try {
                    const wb = XLSX.utils.book_new();
                    XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(rows), 'Raw Data');
                    
                    const statsRows = Object.entries(stats).map(([col, s]) => ({ 
                        Feature: col, Mean: s.mean, Min: s.min, Median: s.median, Max: s.max, Count: s.count 
                    }));
                    XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(statsRows), 'Statistics');
                    XLSX.writeFile(wb, filenameBase + '.xlsx');
                } catch (e) { showToast('Сбой экспорта: ' + e.message); }
            }

            // 10. ГОЛОСОВОЙ ВВОД
            window.startVoiceInput = function() {
                const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
                if (!SpeechRecognition) return showToast('Браузер не поддерживает Web Speech API');
                
                const recognition = new SpeechRecognition(); 
                recognition.lang = 'ru-RU'; 
                recognition.interimResults = false;
                
                const btn = document.getElementById('voiceBtn'); 
                btn.style.color = '#ef4444'; // Красный цвет записи
                btn.style.transform = 'scale(1.1)';
                showToast('Говорите...');
                
                recognition.start();
                
                recognition.onresult = (e) => { 
                    const input = document.getElementById('mainInput');
                    input.value += (input.value ? ' ' : '') + e.results[0][0].transcript; 
                };
                
                recognition.onerror = () => showToast('Речь не распознана'); 
                recognition.onend = () => { 
                    btn.style.color = ''; 
                    btn.style.transform = 'scale(1)'; 
                };
            }

            // 11. ГЛОБАЛЬНЫЕ СЛУШАТЕЛИ И ИНИЦИАЛИЗАЦИЯ
            document.getElementById('mainInput').addEventListener('keydown', function(e) { 
                // Отправка по Enter (Shift+Enter для переноса строки)
                if (e.key === 'Enter' && !e.shiftKey) { 
                    e.preventDefault(); 
                    window.handleSend(); 
                }
            });

            // Плавный скролл к якорям
            document.querySelectorAll('a[href^="#"]').forEach(anchor => { 
                anchor.addEventListener('click', function(e) { 
                    e.preventDefault(); 
                    const target = document.querySelector(this.getAttribute('href')); 
                    if (target) target.scrollIntoView({ behavior: 'smooth', block: 'start' }); 
                }); 
            });

            // Анимации при скролле
            const observer = new IntersectionObserver((entries) => { 
                entries.forEach(e => { 
                    if (e.isIntersecting) { 
                        e.target.style.opacity = '1'; 
                        e.target.style.transform = 'translateY(0)'; 
                    }
                }); 
            }, { threshold: 0.1 });
            
            document.querySelectorAll('.feature-card, .step').forEach(el => { 
                el.style.opacity = '0'; 
                el.style.transform = 'translateY(20px)'; 
                el.style.transition = 'all 0.6s cubic-bezier(0.4, 0, 0.2, 1)'; 
                observer.observe(el); 
            });

            // Восстановление UI (память) при загрузке страницы
            restoreUI();
        });
    </script>
