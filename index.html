<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Quanta AI</title>
    <meta name="description" content="Quanta AI — универсальная платформа: диалоги с AI, генерация изображений, анализ документов и презентаций.">
    <meta property="og:title" content="Quanta AI">
    <meta property="og:description" content="Quanta AI — универсальная платформа: диалоги с AI, генерация изображений, анализ документов и презентаций.">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">

    <!-- Client-side Document & Spreadsheet Parsing Libraries -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/mammoth/1.6.0/mammoth.browser.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/pptxgenjs@3.12.0/dist/pptxgen.bundle.js"></script>

    <style>
        :root {
            --bg-canvas: #1e1e1e;
            --bg-sidebar: #171717;
            --bg-surface: #242424;
            --bg-surface-hover: #2e2e2e;
            --bg-input: #212121;
            --border-subtle: #2f2f2f;
            --border-medium: #3a3a3a;
            --text-main: #f3f4f6;
            --text-muted: #9ca3af;
            --text-faint: #6b7280;
            --accent-purple: #7c3aed;
            --accent-purple-hover: #6d28d9;
            --accent-green-border: #10b981;
            --accent-green-bg: rgba(16, 185, 129, 0.12);
            --danger: #ef4444;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            -webkit-tap-highlight-color: transparent;
        }

        html, body {
            width: 100%;
            height: 100%;
            height: 100dvh;
            max-width: 100vw;
            background: var(--bg-canvas);
            color: var(--text-main);
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            overflow: hidden;
            margin: 0;
            padding: 0;
        }

        /* ===== Main Application Shell ===== */
        .app-shell {
            display: flex;
            width: 100%;
            height: 100%;
            height: 100dvh;
            overflow: hidden;
            position: relative;
        }

        /* ===== Sidebar (Matching 438.png) ===== */
        .sidebar {
            width: 260px;
            background: var(--bg-sidebar);
            border-right: 1px solid var(--border-subtle);
            display: flex;
            flex-direction: column;
            flex-shrink: 0;
            z-index: 40;
            transition: transform 0.25s cubic-bezier(0.4, 0, 0.2, 1), width 0.25s ease;
        }

        .sidebar.collapsed {
            transform: translateX(-100%);
            width: 0;
            border-right: none;
            overflow: hidden;
        }

        .sidebar-header {
            padding: 16px 16px 12px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .brand-badge {
            display: flex;
            align-items: center;
            gap: 10px;
            text-decoration: none;
            color: var(--text-main);
        }

        .brand-icon-square {
            width: 28px;
            height: 28px;
            background: var(--accent-purple);
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 700;
            font-size: 15px;
            color: #ffffff;
            box-shadow: 0 2px 8px rgba(124, 58, 237, 0.4);
        }

        .brand-name {
            font-weight: 700;
            font-size: 1.05rem;
            letter-spacing: -0.2px;
        }

        /* + Новый чат button */
        .btn-new-chat {
            margin: 0 14px 14px;
            padding: 9px 12px;
            background: #212121;
            border: 1px solid var(--border-subtle);
            border-radius: 8px;
            color: var(--text-main);
            font-size: 0.85rem;
            font-weight: 500;
            display: flex;
            align-items: center;
            gap: 8px;
            cursor: pointer;
            transition: background 0.15s, border-color 0.15s;
            text-align: left;
        }

        .btn-new-chat:hover {
            background: var(--bg-surface-hover);
            border-color: var(--border-medium);
        }

        /* Sidebar Section Titles */
        .sidebar-nav-title {
            font-size: 0.68rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.6px;
            color: var(--text-faint);
            padding: 10px 16px 6px;
        }

        .sidebar-menu {
            display: flex;
            flex-direction: column;
            gap: 2px;
            padding: 0 8px;
        }

        .sidebar-menu-btn {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 7px 10px;
            border-radius: 6px;
            color: var(--text-muted);
            font-size: 0.82rem;
            font-weight: 400;
            background: transparent;
            border: none;
            cursor: pointer;
            width: 100%;
            text-align: left;
            transition: background 0.15s, color 0.15s;
        }

        .sidebar-menu-btn svg {
            color: var(--text-muted);
            flex-shrink: 0;
            transition: color 0.15s;
        }

        .sidebar-menu-btn:hover {
            background: var(--bg-surface);
            color: var(--text-main);
        }

        .sidebar-menu-btn:hover svg {
            color: var(--text-main);
        }

        /* Chat History Section */
        .chat-history-container {
            flex: 1;
            overflow-y: auto;
            padding: 4px 8px;
            display: flex;
            flex-direction: column;
            gap: 2px;
        }

        .history-item-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 6px;
            padding: 7px 10px;
            border-radius: 6px;
            color: var(--text-muted);
            font-size: 0.82rem;
            background: transparent;
            cursor: pointer;
            width: 100%;
            transition: background 0.15s, color 0.15s;
            position: relative;
            user-select: none;
        }

        .history-item-row:hover {
            background: var(--bg-surface);
            color: var(--text-main);
        }

        .history-item-row.active {
            background: var(--bg-surface);
            color: var(--text-main);
            font-weight: 500;
        }

        .history-item-title {
            display: flex;
            align-items: center;
            gap: 8px;
            overflow: hidden;
            flex: 1;
            min-width: 0;
        }

        .history-item-title span {
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .history-item-title svg {
            color: var(--text-faint);
            flex-shrink: 0;
        }

        .history-item-row:hover .history-item-title svg {
            color: var(--text-muted);
        }

        .history-delete-btn {
            background: transparent;
            border: none;
            color: var(--text-faint);
            cursor: pointer;
            padding: 4px;
            border-radius: 4px;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
            opacity: 0;
            transition: opacity 0.15s, color 0.15s, background 0.15s;
        }

        .history-item-row:hover .history-delete-btn {
            opacity: 0.7;
        }

        .history-delete-btn:hover {
            opacity: 1 !important;
            color: var(--danger) !important;
            background: rgba(239, 68, 68, 0.15);
        }

        @media (hover: none) {
            .history-delete-btn {
                opacity: 0.7;
            }
        }

        .history-empty-placeholder {
            color: var(--text-faint);
            font-size: 0.78rem;
            padding: 10px 8px;
            text-align: center;
            line-height: 1.4;
        }

        /* Sidebar Footer (Matching 438.png: Настройки API & Dmitriy Poveslo) */
        .sidebar-footer {
            padding: 12px 14px;
            border-top: 1px solid var(--border-subtle);
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .footer-action-btn {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 6px 8px;
            border-radius: 6px;
            background: transparent;
            border: none;
            color: var(--text-muted);
            font-size: 0.82rem;
            cursor: pointer;
            width: 100%;
            text-align: left;
            transition: background 0.15s, color 0.15s;
        }

        .footer-action-btn:hover {
            background: var(--bg-surface);
            color: var(--text-main);
        }

        .footer-action-btn.api-configured {
            color: #4ade80;
        }

        .footer-action-btn.api-configured svg {
            color: #4ade80;
        }

        .user-profile-row {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 6px 8px;
            border-radius: 6px;
            background: transparent;
            border: none;
            color: var(--text-main);
            font-size: 0.85rem;
            cursor: pointer;
            width: 100%;
            text-align: left;
        }

        .user-avatar-circle {
            width: 26px;
            height: 26px;
            border-radius: 50%;
            background: #3b82f6;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.75rem;
            font-weight: 600;
            color: #ffffff;
            overflow: hidden;
            flex-shrink: 0;
        }

        .user-avatar-circle img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        /* ===== Main Workspace (FULL PC WIDTH, No squishing!) ===== */
        .app-main {
            flex: 1 1 0%;
            width: 100%;
            height: 100%;
            height: 100dvh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            min-width: 0;
            background: var(--bg-canvas);
            position: relative;
        }

        /* Top Header Bar */
        .top-header {
            height: 52px;
            border-bottom: 1px solid var(--border-subtle);
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 18px;
            background: var(--bg-canvas);
            flex-shrink: 0;
            width: 100%;
            z-index: 20;
        }

        .header-left {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .header-btn {
            background: transparent;
            border: none;
            color: var(--text-muted);
            cursor: pointer;
            padding: 6px;
            border-radius: 6px;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: background 0.15s, color 0.15s;
        }

        .header-btn:hover {
            color: var(--text-main);
            background: var(--bg-surface);
        }

        .header-title {
            font-size: 0.95rem;
            font-weight: 600;
            color: var(--text-main);
        }

        .header-action-plus {
            width: 26px;
            height: 26px;
            background: var(--bg-surface);
            border: 1px solid var(--border-subtle);
            border-radius: 6px;
            color: var(--text-muted);
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.15s;
        }

        .header-action-plus:hover {
            color: var(--text-main);
            background: var(--bg-surface-hover);
        }

        .header-action-green-settings {
            width: 26px;
            height: 26px;
            background: var(--accent-green-bg);
            border: 1px solid var(--accent-green-border);
            border-radius: 6px;
            color: var(--accent-green-border);
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.15s;
        }

        .header-action-green-settings:hover {
            background: rgba(16, 185, 129, 0.22);
            color: #34d399;
        }

        /* Chat / Welcome Area (Centered with full width stretch) */
        .workspace-scroll-area {
            flex: 1 1 0%;
            overflow-y: auto;
            overflow-x: hidden;
            display: flex;
            flex-direction: column;
            width: 100%;
            position: relative;
            padding: 16px 24px;
        }

        .workspace-content-center {
            width: 100%;
            max-width: 860px;
            margin: 0 auto;
            flex: 1;
            display: flex;
            flex-direction: column;
        }

        /* ===== Welcome View (Matching 438.png 1:1) ===== */
        .welcome-center-box {
            margin: auto;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 20px 0 40px;
            width: 100%;
            animation: fadeIn 0.25s ease-out;
        }

        .welcome-logo-large {
            width: 48px;
            height: 48px;
            background: var(--accent-purple);
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 26px;
            font-weight: 700;
            color: #ffffff;
            margin-bottom: 20px;
            box-shadow: 0 4px 16px rgba(124, 58, 237, 0.35);
        }

        /* Welcome Auto-Animated Phrase (10 Phrases Automatic Transition, No Switchers) */
        .welcome-phrase-wrapper {
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 28px;
            width: 100%;
            max-width: 680px;
            min-height: 46px;
            position: relative;
        }

        .welcome-heading {
            font-size: 1.7rem;
            font-weight: 600;
            color: #ffffff;
            letter-spacing: -0.3px;
            text-align: center;
            margin: 0;
            line-height: 1.35;
            background: linear-gradient(180deg, #ffffff 10%, #d8d4ec 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            will-change: transform, opacity, filter;
            pointer-events: none;
            user-select: none;
        }

        @keyframes phraseEntranceAnim {
            0% {
                opacity: 0;
                transform: translateY(14px) scale(0.97);
                filter: blur(8px);
            }
            100% {
                opacity: 1;
                transform: translateY(0) scale(1);
                filter: blur(0px);
            }
        }

        @keyframes phraseExitAnim {
            0% {
                opacity: 1;
                transform: translateY(0) scale(1);
                filter: blur(0px);
            }
            100% {
                opacity: 0;
                transform: translateY(-12px) scale(0.97);
                filter: blur(6px);
            }
        }

        .welcome-heading.anim-in {
            animation: phraseEntranceAnim 0.7s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }

        .welcome-heading.anim-out {
            animation: phraseExitAnim 0.35s cubic-bezier(0.4, 0, 1, 1) forwards;
        }

        @media (max-width: 640px) {
            .welcome-heading {
                font-size: 1.35rem;
            }
        }

        /* 6 Quick Action Buttons (2 rows of 3, No emojis, Pure SVG) */
        .quick-pills-grid {
            display: grid;
            grid-template-columns: repeat(3, minmax(0, 1fr));
            gap: 10px;
            width: 100%;
            max-width: 580px;
        }

        .pill-btn {
            background: var(--bg-surface);
            border: 1px solid var(--border-subtle);
            border-radius: 8px;
            padding: 10px 14px;
            color: #d1d5db;
            font-size: 0.84rem;
            font-weight: 500;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            cursor: pointer;
            transition: all 0.15s;
            white-space: nowrap;
        }

        .pill-btn svg {
            color: var(--text-muted);
            flex-shrink: 0;
            transition: color 0.15s;
        }

        .pill-btn:hover {
            background: var(--bg-surface-hover);
            border-color: var(--border-medium);
            color: #ffffff;
        }

        .pill-btn:hover svg {
            color: #ffffff;
        }

        /* ===== Messages Feed ===== */
        .messages-container {
            display: flex;
            flex-direction: column;
            gap: 22px;
            width: 100%;
            padding-bottom: 20px;
        }

        .msg-row {
            display: flex;
            width: 100%;
            animation: fadeIn 0.2s ease-out;
        }

        .msg-row.user {
            justify-content: flex-end;
        }

        .msg-row.assistant {
            justify-content: flex-start;
        }

        .msg-bubble {
            font-size: 0.92rem;
            line-height: 1.6;
        }

        .msg-row.user .msg-bubble {
            background: var(--bg-surface);
            border: 1px solid var(--border-subtle);
            border-radius: 18px 18px 4px 18px;
            padding: 10px 16px;
            color: var(--text-main);
            max-width: 82%;
        }

        .msg-row.assistant .msg-bubble {
            flex: 1;
            max-width: 100%;
            background: transparent;
            padding: 2px 0;
            color: var(--text-main);
        }

        .markdown-body p {
            margin-bottom: 10px;
        }

        .markdown-body p:last-child {
            margin-bottom: 0;
        }

        /* Code Block Container with Language Header and Copy Button */
        .code-block-wrapper {
            margin: 14px 0;
            border: 1px solid var(--border-subtle);
            border-radius: 9px;
            background: #141414;
            overflow: hidden;
            box-shadow: 0 4px 16px rgba(0, 0, 0, 0.25);
        }

        .code-block-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 7px 12px;
            background: #1a1a1a;
            border-bottom: 1px solid var(--border-subtle);
        }

        .code-lang-label {
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.72rem;
            font-weight: 600;
            color: var(--text-muted);
            letter-spacing: 0.06em;
            text-transform: uppercase;
        }

        .code-copy-btn {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            background: transparent;
            border: 1px solid var(--border-subtle);
            border-radius: 5px;
            padding: 4px 10px;
            color: var(--text-muted);
            font-size: 0.72rem;
            font-family: inherit;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.15s ease;
            user-select: none;
        }

        .code-copy-btn:hover {
            background: var(--bg-surface);
            border-color: var(--border-medium);
            color: #ffffff;
        }

        .code-copy-btn.copied {
            border-color: rgba(74, 222, 128, 0.5);
            color: #4ade80;
            background: rgba(74, 222, 128, 0.1);
        }

        .code-block-wrapper pre {
            margin: 0 !important;
            border: none !important;
            border-radius: 0 !important;
            background: #121212 !important;
            padding: 12px 14px;
            overflow-x: auto;
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.82rem;
            line-height: 1.55;
            color: #e5e7eb;
        }

        .markdown-body pre code {
            background: transparent;
            padding: 0;
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.82rem;
        }

        .markdown-body code {
            font-family: 'JetBrains Mono', monospace;
            background: rgba(255, 255, 255, 0.08);
            padding: 2px 6px;
            border-radius: 4px;
            font-size: 0.84em;
            color: #e5e7eb;
        }

        /* Message File Attachment Cards */
        .msg-attached-image {
            max-width: 320px;
            max-height: 320px;
            width: auto;
            height: auto;
            border-radius: 10px;
            margin-bottom: 8px;
            display: block;
            border: 1px solid var(--border-subtle);
            object-fit: cover;
        }

        .msg-file-card {
            display: inline-flex;
            align-items: center;
            gap: 12px;
            background: rgba(0, 0, 0, 0.25);
            border: 1px solid var(--border-medium);
            border-radius: 10px;
            padding: 10px 14px;
            margin-bottom: 8px;
            max-width: 100%;
            transition: border-color 0.15s;
        }

        .msg-file-icon {
            width: 36px;
            height: 36px;
            border-radius: 8px;
            background: var(--bg-surface-hover);
            border: 1px solid var(--border-subtle);
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--accent-purple);
            flex-shrink: 0;
        }

        .msg-file-info {
            display: flex;
            flex-direction: column;
            gap: 2px;
            overflow: hidden;
        }

        .msg-file-name {
            font-size: 0.84rem;
            font-weight: 600;
            color: var(--text-main);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            max-width: 260px;
        }

        .msg-file-meta {
            font-size: 0.72rem;
            color: var(--text-muted);
        }

        .markdown-body ul, .markdown-body ol {
            margin: 10px 0;
            padding-left: 22px;
        }

        .meta-stat-badge {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            font-size: 0.7rem;
            color: var(--text-faint);
            margin-top: 8px;
            background: var(--bg-surface);
            padding: 3px 8px;
            border-radius: 5px;
            border: 1px solid var(--border-subtle);
        }

        /* ===== Bottom Input Area (Matching 438.png) ===== */
        .bottom-compose-area {
            width: 100%;
            padding: 8px 24px 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            background: linear-gradient(180deg, rgba(30, 30, 30, 0) 0%, var(--bg-canvas) 35%);
            flex-shrink: 0;
            z-index: 20;
        }

        .compose-card {
            width: 100%;
            max-width: 860px;
            background: var(--bg-input);
            border: 1px solid var(--border-medium);
            border-radius: 18px;
            padding: 12px 16px;
            display: flex;
            flex-direction: column;
            gap: 8px;
            box-shadow: 0 4px 24px rgba(0, 0, 0, 0.35);
            transition: border-color 0.2s, box-shadow 0.2s;
        }

        .compose-card:focus-within {
            border-color: #525252;
            box-shadow: 0 6px 32px rgba(0, 0, 0, 0.5);
        }

        .compose-card.drag-over {
            border-color: var(--accent-purple);
            background: #25222e;
            box-shadow: 0 0 20px rgba(168, 85, 247, 0.35);
        }

        .compose-textarea {
            width: 100%;
            background: transparent;
            border: none;
            outline: none;
            color: var(--text-main);
            font-family: inherit;
            font-size: 0.92rem;
            resize: none;
            max-height: 180px;
            min-height: 24px;
            line-height: 1.5;
            padding: 2px 0;
        }

        .compose-textarea::placeholder {
            color: #636363;
        }

        .compose-bottom-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding-top: 4px;
        }

        .compose-left-tools {
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .compose-right-tools {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .compose-tool-btn {
            background: transparent;
            border: none;
            color: var(--text-muted);
            cursor: pointer;
            padding: 6px;
            border-radius: 6px;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: background 0.15s, color 0.15s;
        }

        .compose-tool-btn:hover {
            color: var(--text-main);
            background: var(--bg-surface);
        }

        /* Microphone Working Animation */
        @keyframes pulseMic {
            0%, 100% {
                transform: scale(1);
                filter: drop-shadow(0 0 4px rgba(239, 68, 68, 0.6));
            }
            50% {
                transform: scale(1.15);
                filter: drop-shadow(0 0 10px rgba(239, 68, 68, 0.95));
            }
        }

        .compose-tool-btn.recording {
            animation: pulseMic 1s infinite ease-in-out;
            color: var(--danger) !important;
            background: rgba(239, 68, 68, 0.15) !important;
        }

        /* Model Selector Dropdown (Matching 438.png: "Автовыбор (Free) v") */
        .model-select {
            background: var(--bg-surface);
            border: 1px solid var(--border-subtle);
            color: var(--text-muted);
            font-size: 0.76rem;
            padding: 6px 10px;
            border-radius: 6px;
            outline: none;
            cursor: pointer;
            transition: all 0.15s;
        }

        .model-select:hover {
            color: var(--text-main);
            border-color: var(--border-medium);
        }

        /* Send Button (Matching 438.png: Purple round button with arrow up) */
        .btn-send {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            background: var(--accent-purple);
            border: none;
            color: #ffffff;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.2s;
            flex-shrink: 0;
        }

        .btn-send:hover:not(:disabled) {
            background: var(--accent-purple-hover);
            transform: scale(1.05);
        }

        .btn-send:disabled {
            background: #2e2e2e;
            color: #555555;
            cursor: not-allowed;
            transform: none;
        }

        /* File and Image preview chip inside input */
        .pending-file-chip {
            display: none;
            align-items: center;
            gap: 8px;
            background: #202020;
            border: 1px solid var(--border-medium);
            padding: 5px 10px;
            border-radius: 7px;
            font-size: 0.76rem;
            color: var(--text-main);
            width: fit-content;
            max-width: 100%;
        }

        .pending-file-chip img {
            width: 24px;
            height: 24px;
            border-radius: 4px;
            object-fit: cover;
        }

        .chip-file-icon {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 22px;
            height: 22px;
            color: var(--accent-purple);
            flex-shrink: 0;
        }

        .chip-name {
            font-weight: 500;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            max-width: 220px;
        }

        .chip-size {
            font-size: 0.7rem;
            color: var(--text-muted);
            white-space: nowrap;
        }

        /* Toast notification (NO emojis) */
        .toast-box {
            position: fixed;
            bottom: 84px;
            left: 50%;
            transform: translateX(-50%);
            background: var(--bg-surface);
            border: 1px solid var(--border-medium);
            color: var(--text-main);
            font-size: 0.8rem;
            padding: 8px 16px;
            border-radius: 20px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.4);
            pointer-events: none;
            opacity: 0;
            transition: opacity 0.2s, transform 0.2s;
            z-index: 100;
        }

        .toast-box.show {
            opacity: 1;
            transform: translateX(-50%) translateY(-6px);
        }

        /* Modal windows */
        .modal-backdrop {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.7);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 100;
            padding: 16px;
        }

        .modal-backdrop.open {
            display: flex;
        }

        .modal-card {
            background: var(--bg-sidebar);
            border: 1px solid var(--border-medium);
            border-radius: 14px;
            width: 100%;
            max-width: 440px;
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 16px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.6);
        }

        .modal-title-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .modal-title-text {
            font-size: 1rem;
            font-weight: 600;
            color: var(--text-main);
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .form-label {
            font-size: 0.78rem;
            color: var(--text-muted);
        }

        .form-input {
            background: var(--bg-canvas);
            border: 1px solid var(--border-subtle);
            border-radius: 8px;
            padding: 8px 12px;
            color: var(--text-main);
            font-size: 0.85rem;
            outline: none;
        }

        .form-input:focus {
            border-color: var(--accent-purple);
        }

        .modal-presets-row {
            display: flex;
            gap: 6px;
            flex-wrap: wrap;
        }

        .preset-pill-btn {
            background: var(--bg-surface);
            border: 1px solid var(--border-subtle);
            color: var(--text-muted);
            border-radius: 6px;
            padding: 5px 10px;
            font-size: 0.76rem;
            cursor: pointer;
            transition: all 0.15s;
        }

        .preset-pill-btn:hover {
            color: var(--text-main);
            background: var(--bg-surface-hover);
            border-color: var(--border-medium);
        }

        .form-hint {
            font-size: 0.72rem;
            color: var(--text-faint);
            line-height: 1.4;
        }

        .modal-actions-row {
            display: flex;
            gap: 8px;
            justify-content: flex-end;
            margin-top: 6px;
        }

        .modal-btn-cancel {
            width: auto !important;
            padding: 7px 14px !important;
            background: var(--bg-surface) !important;
        }

        .modal-btn-save {
            width: auto !important;
            padding: 7px 14px !important;
            background: var(--accent-purple) !important;
            color: #ffffff !important;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(4px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* Responsive overlays for mobile */
        .sidebar-backdrop-mobile {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.55);
            z-index: 35;
            display: none;
        }

        @media (max-width: 768px) {
            .sidebar {
                position: fixed;
                top: 0;
                bottom: 0;
                left: 0;
                transform: translateX(-100%);
            }

            .sidebar.mobile-open {
                transform: translateX(0);
            }

            .sidebar-backdrop-mobile.show {
                display: block;
            }

            .quick-pills-grid {
                grid-template-columns: repeat(2, minmax(0, 1fr));
            }
        }
    </style>
</head>
<body>
    <div class="app-shell">
        <!-- Mobile Sidebar Backdrop -->

        <!-- Left Sidebar Navigation (Matching 438.png) -->

        <!-- Main Workspace (Spans entire screen width on PC!) -->
        <main class="app-main">
            <!-- Top Header Bar -->
            <header class="top-header">
                <div class="header-left">
                    <button class="header-btn" onclick="toggleSidebar()" title="Меню">
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="3" y1="12" x2="21" y2="12"></line><line x1="3" y1="6" x2="21" y2="6"></line><line x1="3" y1="18" x2="21" y2="18"></line></svg>
                    </button>

                        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></svg>

        function getSavedChats() {
            try {
                const raw = localStorage.getItem('quanta_saved_chats');

                console.error(e);
            }
            return defaultChatSessions;

        function saveSavedChats(chats) {
            try {
                localStorage.setItem('quanta_saved_chats', JSON.stringify(chats));
            } catch (e) {
                console.error(e);
            }
        }

        function renderHistoryList() {
            const container = document.getElementById('historyList');
            if (!container) return;
            const chats = getSavedChats();
            container.innerHTML = '';

            if (chats.length === 0) {
                container.innerHTML = '<div class="history-empty-placeholder">История диалогов пуста</div>';
                return;
            }

            chats.forEach((chat) => {
                const row = document.createElement('div');
                row.className = `history-item-row ${chat.id === currentChatId ? 'active' : ''}`;
                row.onclick = () => openChatSession(chat.id);

                row.innerHTML = `
                    <div class="history-item-title" title="${escapeHtml(chat.title)}">
                        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>

                    </button>

                container.appendChild(row);
            });

        function openChatSession(id) {
            const chats = getSavedChats();
            const chat = chats.find(c => c.id === id);
            if (!chat) return;
            currentChatId = id;
            conversationMessages = chat.messages ? [...chat.messages] : [];

            const welcome = document.getElementById('welcomeView');
            const container = document.getElementById('messagesContainer');
            container.innerHTML = '';

            if (conversationMessages.length === 0) {
                welcome.style.display = 'flex';
                initWelcomePhrase();
            } else {
                welcome.style.display = 'none';
                conversationMessages.forEach(msg => {
                    appendMessage(msg.role, msg.content, msg.file || msg.imgUrl, msg.stat);
                });
            }

            renderHistoryList();
            if (window.innerWidth <= 768) {
                const sidebar = document.getElementById('sidebar');
                const backdrop = document.getElementById('mobileBackdrop');
                if (sidebar) sidebar.classList.remove('mobile-open');
                if (backdrop) backdrop.classList.remove('show');
            }
        }

        function deleteChatSession(event, id) {
            if (event) event.stopPropagation();
            let chats = getSavedChats();
            chats = chats.filter(c => c.id !== id);
            saveSavedChats(chats);
            if (currentChatId === id) {
                if (chats.length > 0) {
                    openChatSession(chats[0].id);
                } else {
                    createNewChat();
                }
            } else {
                renderHistoryList();
            }
            triggerToast('Чат удален из истории');
        }

        function persistCurrentChat() {
            const chats = getSavedChats();
            let chat = chats.find(c => c.id === currentChatId);
            if (!chat) {
                let firstMsgText = conversationMessages.find(m => m.role === 'user')?.content || 'Новый диалог';
                if (firstMsgText.length > 28) firstMsgText = firstMsgText.slice(0, 28) + '...';
                chat = {
                    id: currentChatId,
                    title: firstMsgText,
                    messages: conversationMessages
                };
                chats.unshift(chat);
            } else {
                if (chat.title === 'Новый диалог' || !chat.title) {
                    const firstMsgText = conversationMessages.find(m => m.role === 'user')?.content;
                    if (firstMsgText) {
                        chat.title = firstMsgText.length > 28 ? firstMsgText.slice(0, 28) + '...' : firstMsgText;
                    }
                }
                chat.messages = conversationMessages;
            }
            saveSavedChats(chats);
            renderHistoryList();
        }

        // ==========================================
        // API SETTINGS & STORAGE (Robust & Verified)
        // ==========================================
        function getApiSettings() {
            let key = localStorage.getItem('quanta_api_key') || '';
            let endpoint = localStorage.getItem('quanta_api_endpoint') || 'https://openrouter.ai/api/v1/chat/completions';
            let customModel = localStorage.getItem('quanta_custom_model') || '';

            // Also check bundled object if exists
            try {
                const bundle = localStorage.getItem('quanta_api_settings');
                if (bundle) {
                    const parsed = JSON.parse(bundle);
                    if (parsed.apiKey && !key) key = parsed.apiKey;
                    if (parsed.endpoint && !endpoint) endpoint = parsed.endpoint;
                    if (parsed.customModel && !customModel) customModel = parsed.customModel;
                }
            } catch (e) {}

            return {
                apiKey: (key || '').trim().replace(/^["']|["']$/g, ''),
                endpoint: (endpoint || '').trim() || 'https://openrouter.ai/api/v1/chat/completions',
                customModel: (customModel || '').trim()
            };
        }

        function updateSettingsVisualIndicators() {
            const settings = getApiSettings();
            const footerBtn = document.getElementById('footerSettingsBtn');
            const headerBtn = document.getElementById('headerGreenSettingsBtn');
            const hasKey = Boolean(settings.apiKey);

            if (footerBtn) {
                if (hasKey) footerBtn.classList.add('api-configured');
                else footerBtn.classList.remove('api-configured');
            }
            if (headerBtn) {
                if (hasKey) {
                    headerBtn.style.borderColor = 'rgba(74, 222, 128, 0.4)';
                    headerBtn.style.color = '#4ade80';
                } else {
                    headerBtn.style.borderColor = '';
                    headerBtn.style.color = '';

            const keyEl = document.getElementById('settingsApiKey');

        // ==========================================
        // WORKING MICROPHONE WITH PERMISSION HANDLING
        // ==========================================
        async function toggleVoiceRecording() {
            const micBtn = document.getElementById('voiceMicBtn');

            if (isRecordingSpeech && speechRecognizer) {
                try {
                    speechRecognizer.stop();
                } catch (e) {}
                stopMicUi();
                triggerToast('Запись речи остановлена');
                return;
            }

            const SpeechAPI = window.SpeechRecognition || window.webkitSpeechRecognition;
            if (!SpeechAPI) {
                triggerToast('Голосовой ввод не поддерживается браузером');
                return;
            }

            // Step 1: Request permission
            try {
                if (navigator.mediaDevices && navigator.mediaDevices.getUserMedia) {
                    const testStream = await navigator.mediaDevices.getUserMedia({ audio: true });
                    testStream.getTracks().forEach(track => track.stop());
                }
            } catch (err) {
                console.warn('Microphone access denied:', err);
                triggerToast('Предоставьте доступ к микрофону в браузере');
                return;
            }

            // Step 2: Initialize Speech API
            try {
                const rec = new SpeechAPI();
                rec.lang = 'ru-RU';
                rec.interimResults = true;
                rec.continuous = false;
                rec.maxAlternatives = 1;

                speechRecognizer = rec;
                isRecordingSpeech = true;

                micBtn.classList.add('recording');
                triggerToast('Слушаю... Говорите');

                const input = document.getElementById('mainPromptInput');
                const baselineText = input.value.trim();

                rec.onresult = (e) => {
                    let text = '';
                    for (let i = e.resultIndex; i < e.results.length; ++i) {
                        text += e.results[i][0].transcript;
                    }
                    input.value = (baselineText ? baselineText + ' ' : '') + text;
                    onInputAutoResize(input);
                };

                rec.onerror = (ev) => {
                    console.warn('Speech recognition error:', ev.error);
                    if (ev.error === 'not-allowed') {
                        triggerToast('Доступ к микрофону заблокирован');
                    } else if (ev.error === 'no-speech') {
                        triggerToast('Речь не распознана');
                    } else {
                        triggerToast('Микрофон: ' + ev.error);
                    }
                    stopMicUi();
                };

                rec.onend = () => {
                    stopMicUi();
                };

                rec.start();
            } catch (err) {
                console.error('Failed to start microphone:', err);
                triggerToast('Не удалось включить микрофон');
                stopMicUi();
            }
        }

        function stopMicUi() {
            isRecordingSpeech = false;
            speechRecognizer = null;
            const micBtn = document.getElementById('voiceMicBtn');
            if (micBtn) micBtn.classList.remove('recording');
        }

        // ==========================================
        // FILE & IMAGE ATTACHMENTS (Zero emojis, full format support)
        // ==========================================
        function formatFileSize(bytes) {
            if (!bytes || bytes <= 0) return '0 B';
            const k = 1024;
            const sizes = ['B', 'KB', 'MB', 'GB'];
            const i = Math.floor(Math.log(bytes) / Math.log(k));
            return parseFloat((bytes / Math.pow(k, i)).toFixed(1)) + ' ' + sizes[i];
        }

        function displayAttachmentChip() {
            if (!attachedFile) return;

            const chip = document.getElementById('pendingChip');
            const chipImg = document.getElementById('chipImg');
            const chipFileIcon = document.getElementById('chipFileIcon');
            const chipLabel = document.getElementById('chipLabel');
            const chipSize = document.getElementById('chipSize');

            if (attachedFile.isImage && attachedFile.dataUrl) {
                chipImg.src = attachedFile.dataUrl;
                chipImg.style.display = 'inline-block';
                if (chipFileIcon) chipFileIcon.style.display = 'none';
            } else {
                chipImg.style.display = 'none';
                chipImg.src = '';
                if (chipFileIcon) chipFileIcon.style.display = 'inline-flex';
            }

            if (chipLabel) chipLabel.textContent = attachedFile.name;
            if (chipSize) chipSize.textContent = attachedFile.sizeStr || '';
            chip.style.display = 'inline-flex';

            const sendBtn = document.getElementById('sendPromptBtn');
            if (sendBtn) sendBtn.disabled = false;
            onInputAutoResize(document.getElementById('mainPromptInput'));
        }

        async function processAttachedFile(file) {
            if (!file) return;

            const ext = (file.name.split('.').pop() || '').toLowerCase();
            const sizeStr = formatFileSize(file.size);
            const isImage = ['png', 'jpg', 'jpeg', 'webp', 'gif', 'svg', 'bmp'].includes(ext);

            triggerToast('Обработка: ' + file.name);

            if (isImage) {
                const reader = new FileReader();
                reader.onload = () => {
                    attachedFile = {
                        name: file.name,
                        size: file.size,
                        sizeStr: sizeStr,
                        ext: ext,
                        isImage: true,
                        dataUrl: reader.result,
                        content: ''
                    };
                    displayAttachmentChip();
                    triggerToast('Изображение прикреплено');
                };
                reader.onerror = () => triggerToast('Ошибка чтения изображения');
                reader.readAsDataURL(file);
                return;
            }

            // Documents, spreadsheets, code files, text
            let extractedText = '';
            try {
                if (['txt', 'csv', 'json', 'md', 'xml', 'yaml', 'yml', 'js', 'ts', 'jsx', 'tsx', 'py', 'cpp', 'c', 'h', 'hpp', 'cs', 'java', 'go', 'rs', 'php', 'rb', 'swift', 'kt', 'sql', 'sh', 'bat', 'html', 'css', 'scss', 'env', 'log', 'ini', 'toml'].includes(ext)) {
                    extractedText = await file.text();
                } else if (ext === 'docx' && window.mammoth) {
                    const buf = await file.arrayBuffer();
                    const parsed = await window.mammoth.extractRawText({ arrayBuffer: buf });
                    extractedText = parsed.value || '';
                } else if (ext === 'pdf' && window.pdfjsLib) {
                    const buf = await file.arrayBuffer();
                    const pdf = await window.pdfjsLib.getDocument({ data: buf }).promise;
                    let fullText = '';
                    for (let p = 1; p <= Math.min(pdf.numPages, 25); p++) {
                        const page = await pdf.getPage(p);
                        const tc = await page.getTextContent();
                        fullText += tc.items.map(item => item.str).join(' ') + '\n';
                    }
                    extractedText = fullText.trim();
                } else if ((ext === 'xlsx' || ext === 'xls') && window.XLSX) {
                    const buf = await file.arrayBuffer();
                    const wb = window.XLSX.read(buf, { type: 'array' });
                    let sheetsText = '';
                    wb.SheetNames.slice(0, 3).forEach(sheetName => {
                        const sheet = wb.Sheets[sheetName];
                        sheetsText += `[Лист: ${sheetName}]\n` + window.XLSX.utils.sheet_to_csv(sheet) + '\n\n';
                    });
                    extractedText = sheetsText.trim();
                } else {
                    extractedText = await file.text();
                }
            } catch (err) {
                console.warn('Text extraction warning:', err);
            }

            attachedFile = {
                name: file.name,
                size: file.size,
                sizeStr: sizeStr,
                ext: ext,
                isImage: false,
                dataUrl: null,
                content: extractedText || ''
            };

            displayAttachmentChip();
            triggerToast('Файл прикреплен: ' + file.name);
        }

        function onImageSelected(e) {
            const file = e.target.files?.[0];
            if (!file) return;
            e.target.value = '';
            processAttachedFile(file);
        }

        function onFileSelected(e) {
            const file = e.target.files?.[0];
            if (!file) return;
            e.target.value = '';
            processAttachedFile(file);
        }

        function clearAttachment() {
            attachedFile = null;
            const chip = document.getElementById('pendingChip');
            const chipImg = document.getElementById('chipImg');
            const chipFileIcon = document.getElementById('chipFileIcon');
            const chipLabel = document.getElementById('chipLabel');
            const chipSize = document.getElementById('chipSize');

            if (chip) chip.style.display = 'none';
            if (chipImg) {
                chipImg.src = '';
                chipImg.style.display = 'none';
            }
            if (chipFileIcon) chipFileIcon.style.display = 'none';
            if (chipLabel) chipLabel.textContent = '';
            if (chipSize) chipSize.textContent = '';

            const generalInput = document.getElementById('generalFileInput');
            if (generalInput) generalInput.value = '';
            const imageInput = document.getElementById('imageFileInput');
            if (imageInput) imageInput.value = '';

            onInputAutoResize(document.getElementById('mainPromptInput'));
        }

        function setupDragAndDrop() {
            const composeCard = document.getElementById('composeCard');
            if (!composeCard) return;

            ['dragenter', 'dragover'].forEach(eventName => {
                composeCard.addEventListener(eventName, (e) => {
                    e.preventDefault();
                    e.stopPropagation();
                    composeCard.classList.add('drag-over');
                });
            });

            ['dragleave', 'drop'].forEach(eventName => {
                composeCard.addEventListener(eventName, (e) => {
                    e.preventDefault();
                    e.stopPropagation();
                    composeCard.classList.remove('drag-over');
                });
            });

            composeCard.addEventListener('drop', (e) => {
                e.preventDefault();
                e.stopPropagation();
                const files = e.dataTransfer?.files;
                if (files && files.length > 0) {
                    processAttachedFile(files[0]);
                }
            });

            document.body.addEventListener('dragover', (e) => e.preventDefault());
            document.body.addEventListener('drop', (e) => {
                e.preventDefault();
                const files = e.dataTransfer?.files;
                if (files && files.length > 0) {
                    processAttachedFile(files[0]);
                }
            });
        }

        function setupPasteListener() {
            const input = document.getElementById('mainPromptInput');
            if (!input) return;

            input.addEventListener('paste', (e) => {
                const items = e.clipboardData?.items;
                if (!items) return;
                for (let i = 0; i < items.length; i++) {
                    if (items[i].type && items[i].type.indexOf('image') !== -1) {
                        const blob = items[i].getAsFile();
                        if (blob) {
                            e.preventDefault();
                            processAttachedFile(blob);
                            triggerToast('Изображение вставлено из буфера');
                            return;
                        }
                    }
                }
            });
        }

        function onModelSelected() {
            const val = document.getElementById('modelDropdown').value;
            if (val === 'flux/image-gen') {
                triggerToast('Режим генерации изображений Flux Art');
            }
        }

        // ==========================================
        // CHAT DISPATCH & API CALLS
        // ==========================================
        async function handleSendPrompt() {
            const input = document.getElementById('mainPromptInput');
            const text = input.value.trim();
            if (!text && !attachedFile) return;

            document.getElementById('welcomeView').style.display = 'none';
            const sendBtn = document.getElementById('sendPromptBtn');
            sendBtn.disabled = true;

            const currentAttachedFile = attachedFile;
            let userText = text;
            if (!userText) {
                if (currentAttachedFile) {
                    userText = currentAttachedFile.isImage ? 'Анализ прикрепленного изображения' : `Анализ файла "${currentAttachedFile.name}"`;
                } else {
                    userText = '';
                }
            }

            clearAttachment();
            input.value = '';
            onInputAutoResize(input);

            // Add user message to UI
            appendMessage('user', userText, currentAttachedFile);

            const selectedModel = document.getElementById('modelDropdown').value;

            // Check if user requested image generation
            const isImageGen = selectedModel === 'flux/image-gen' ||
                /^(нарисуй|сгенерируй\s+(картинк|фото|арт|рисунок)|изобрази|draw|paint)\s+/ui.test(userText);

            if (isImageGen) {
                const cleanPrompt = userText.replace(/^(нарисуй|сгенерируй\s+(картинк|фото|арт|рисунок)|изобрази|draw|paint)\s+/ui, '').trim() || userText;
                const seed = Math.floor(Math.random() * 999999);
                const imgUrl = `https://image.pollinations.ai/prompt/${encodeURIComponent(cleanPrompt)}?width=1024&height=1024&seed=${seed}&nologo=true&model=flux`;

                appendMessage('assistant', `Сгенерировано изображение по запросу: **${cleanPrompt}**\n\n<img src="${imgUrl}" style="max-width: 100%; border-radius: 12px; margin-top: 10px; border: 1px solid var(--border-subtle);" alt="${cleanPrompt}">`, null, 'Flux 1.0 Art');
                sendBtn.disabled = false;
                return;
            }

            // Create Assistant Message Placeholder
            const assistantEl = appendMessage('assistant', 'Генерация ответа...');

            const settings = getApiSettings();
            const apiKey = settings.apiKey;
            const endpoint = settings.endpoint || 'https://openrouter.ai/api/v1/chat/completions';
            let targetModel = settings.customModel || selectedModel;

            // Automatically remap deprecated or offline models to live active free models
            const decommissionedMap = {
                'nvidia/llama-3.1-nemotron-70b-instruct:free': 'nvidia/nemotron-3-super-120b-a12b:free',
                'nvidia/nemotron-3:free': 'nvidia/nemotron-3-super-120b-a12b:free',
                'cohere/command-r:free': 'cohere/north-mini-code:free',
                'meta-llama/llama-3.3-70b-instruct:free': 'google/gemma-4-31b-it:free',
                'mistralai/mistral-small-3.2:free': 'inclusionai/ling-3.0-flash-fin:free',
                'deepseek/deepseek-chat:free': 'nvidia/nemotron-3.5-lightning:free'
            };
            if (decommissionedMap[targetModel]) {
                targetModel = decommissionedMap[targetModel];
            }

            // Prepare prompt content for the model
            let promptForModel = userText;
            let messageContentForApi = promptForModel;

            if (currentAttachedFile) {
                if (currentAttachedFile.isImage && currentAttachedFile.dataUrl) {
                    messageContentForApi = [
                        { type: 'text', text: userText || 'Опиши и проанализируй это изображение подробно.' },
                        { type: 'image_url', image_url: { url: currentAttachedFile.dataUrl } }
                    ];
                } else if (currentAttachedFile.content) {
                    promptForModel = `[Прикрепленный файл: ${currentAttachedFile.name} (${currentAttachedFile.sizeStr})]\n` +
                        `--- Содержимое файла ---\n` +
                        currentAttachedFile.content.slice(0, 32000) +
                        `\n--- Конец содержимого файла ---\n\n` +
                        (text ? `Запрос пользователя: ${text}` : `Пожалуйста, подробно проанализируй данный файл, выдели ключевые тезисы, структуру и выводы.`);
                    messageContentForApi = promptForModel;
                } else {
                    promptForModel = `[Прикрепленный файл: ${currentAttachedFile.name} (${currentAttachedFile.sizeStr})]\n\nЗапрос пользователя: ${userText}`;
                    messageContentForApi = promptForModel;
                }
            }

            const startTime = Date.now();

            try {
                const history = conversationMessages.slice(-8).map(m => {
                    const content = (m.role === 'user' && m.rawPromptForModel) ? m.rawPromptForModel : m.content;
                    return { role: m.role, content: content };
                });
                history.push({ role: 'user', content: messageContentForApi });

                const headers = { 
                    'Content-Type': 'application/json',
                    'HTTP-Referer': window.location.origin || 'https://quanta.ai',
                    'X-Title': 'Quanta AI'
                };
                if (apiKey) {
                    headers['Authorization'] = `Bearer ${apiKey}`;
                }

                let res = await fetch(endpoint, {
                    method: 'POST',
                    headers: headers,
                    body: JSON.stringify({
                        model: targetModel,
                        messages: history,
                        temperature: 0.7
                    })
                });

                // Auto-fallback: if chosen model returns 404 (offline/decommissioned), retry with active fallback
                if (res.status === 404 && targetModel !== 'nvidia/nemotron-3-super-120b-a12b:free') {
                    const fallbackModel = 'nvidia/nemotron-3-super-120b-a12b:free';
                    const retryRes = await fetch(endpoint, {
                        method: 'POST',
                        headers: headers,
                        body: JSON.stringify({
                            model: fallbackModel,
                            messages: history,
                            temperature: 0.7
                        })
                    });
                    if (retryRes.ok) {
                        res = retryRes;
                        targetModel = fallbackModel;
                    }
                }

                if (!res.ok) {
                    let detail = '';
                    try {
                        const errJson = await res.json();
                        detail = errJson?.error?.message || errJson?.error || errJson?.message || '';
                    } catch (e) {}

                    if (res.status === 401) {
                        throw new Error(`Неверный API-ключ (401 Unauthorized). Проверьте ключ в Настройках API в левом нижнем углу.`);
                    } else if (res.status === 402) {
                        throw new Error(`Недостаточно кредитов на аккаунте (402 Payment Required). Выберите бесплатную модель или пополните баланс.`);
                    } else if (res.status === 429) {
                        throw new Error(`Превышен лимит запросов (429 Rate Limit). Пожалуйста, подождите несколько секунд.`);
                    } else if (res.status === 404) {
                        throw new Error(`Модель временно недоступна на провайдере (${targetModel}). Попробуйте выбрать другую модель из списка.`);
                    } else {
                        throw new Error(`Ошибка сервиса (${res.status}): ${detail || 'Сервер не смог вернуть ответ. Проверьте эндпоинт и ключ.'}`);
                    }
                }

                const data = await res.json();
                const reply = data.choices?.[0]?.message?.content || 'Ответ не получен';
                const elapsedSec = Math.max(0.3, (Date.now() - startTime) / 1000);
                const tokens = Math.round(reply.length / 4);
                const speed = (tokens / elapsedSec).toFixed(1);

                updateAssistantMessage(assistantEl, reply, `${speed} ток/сек (${elapsedSec.toFixed(1)}с)`);
                conversationMessages.push(
                    { 
                        role: 'user', 
                        content: userText,
                        file: currentAttachedFile ? {
                            name: currentAttachedFile.name,
                            sizeStr: currentAttachedFile.sizeStr,
                            ext: currentAttachedFile.ext,
                            isImage: currentAttachedFile.isImage,
                            dataUrl: currentAttachedFile.isImage ? currentAttachedFile.dataUrl : null
                        } : null,
                        rawPromptForModel: typeof messageContentForApi === 'string' ? messageContentForApi : userText
                    }, 
                    { 
                        role: 'assistant', 
                        content: reply, 
                        stat: `${speed} ток/сек (${elapsedSec.toFixed(1)}с)` 
                    }
                );
                persistCurrentChat();
            } catch (err) {
                console.error(err);
                updateAssistantMessage(assistantEl, `${err.message}\n\n*Совет: Вы можете открыть «Настройки API» в левом нижнем углу, чтобы проверить ключ и выбрать пресет провайдера.*`);
            } finally {
                sendBtn.disabled = false;
            }
        }

        // ==========================================
        // UI MESSAGE APPENDING & RENDERING (Zero Emojis, No Avatar on Assistant)
        // ==========================================
        function appendMessage(role, text, fileData = null, statBadge = null) {
            const container = document.getElementById('messagesContainer');
            const row = document.createElement('div');
            row.className = `msg-row ${role}`;

            let contentHtml = '';
            if (role === 'assistant') {
                // Completely removed avatar and letter Q as requested by user
                contentHtml = `
                    <div class="msg-bubble">
                        <div class="markdown-body content-text">${formatMarkdown(text)}</div>
                        <div class="meta-stat-badge" style="${statBadge ? '' : 'display: none;'}">
                            <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>
                            <span class="stat-label">${statBadge || ''}</span>
                        </div>
                    </div>
                `;
            } else {
                let attachmentHtml = '';
                if (fileData) {
                    if (fileData.isImage && fileData.dataUrl) {
                        attachmentHtml = `<img src="${fileData.dataUrl}" class="msg-attached-image" alt="Изображение">`;
                    } else if (typeof fileData === 'string' && (fileData.startsWith('data:image') || fileData.startsWith('http'))) {
                        attachmentHtml = `<img src="${fileData}" class="msg-attached-image" alt="Изображение">`;
                    } else if (fileData.name) {
                        attachmentHtml = `
                            <div class="msg-file-card">
                                <div class="msg-file-icon">
                                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14.5 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7.5L14.5 2z"/><polyline points="14 2 14 8 20 8"/></svg>
                                </div>
                                <div class="msg-file-info">
                                    <div class="msg-file-name" title="${escapeHtml(fileData.name)}">${escapeHtml(fileData.name)}</div>
                                    <div class="msg-file-meta">${escapeHtml(fileData.sizeStr || '')}${fileData.ext ? ' • ' + escapeHtml(fileData.ext.toUpperCase()) : ''}</div>
                                </div>
                            </div>
                        `;
                    }
                }

                contentHtml = `
                    <div class="msg-bubble">
                        ${attachmentHtml}
                        ${text ? `<div class="markdown-body content-text">${escapeHtml(text)}</div>` : ''}
                    </div>
                `;
            }

            row.innerHTML = contentHtml;
            container.appendChild(row);

            const scrollArea = document.getElementById('scrollContainer');
            scrollArea.scrollTop = scrollArea.scrollHeight;
            return row;
        }

        function updateAssistantMessage(wrapperEl, text, badge = null) {
            const content = wrapperEl.querySelector('.content-text');
            if (content) content.innerHTML = formatMarkdown(text);

            const badgeBox = wrapperEl.querySelector('.meta-stat-badge');
            const statLabel = wrapperEl.querySelector('.stat-label');
            if (badgeBox && statLabel && badge) {
                statLabel.textContent = badge;
                badgeBox.style.display = 'inline-flex';
            }

            const scrollArea = document.getElementById('scrollContainer');
            scrollArea.scrollTop = scrollArea.scrollHeight;
        }

        function escapeHtml(str) {
            return (str || '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
        }

        // Copy button in top-right corner of code blocks
        function handleCopyCode(btn) {
            const wrapper = btn.closest('.code-block-wrapper');
            if (!wrapper) return;
            const codeEl = wrapper.querySelector('pre code');
            if (!codeEl) return;
            const textToCopy = codeEl.innerText || codeEl.textContent || '';

            const copyIcon = btn.querySelector('.copy-icon');
            const checkIcon = btn.querySelector('.check-icon');
            const textSpan = btn.querySelector('.copy-btn-text');

            const setSuccessState = () => {
                if (copyIcon) copyIcon.style.display = 'none';
                if (checkIcon) checkIcon.style.display = 'inline-block';
                if (textSpan) textSpan.textContent = 'Скопировано!';
                btn.classList.add('copied');
                triggerToast('Код скопирован в буфер обмена');

                setTimeout(() => {
                    if (copyIcon) copyIcon.style.display = 'inline-block';
                    if (checkIcon) checkIcon.style.display = 'none';
                    if (textSpan) textSpan.textContent = 'Копировать';
                    btn.classList.remove('copied');
                }, 2200);
            };

            if (navigator.clipboard && navigator.clipboard.writeText) {
                navigator.clipboard.writeText(textToCopy)
                    .then(setSuccessState)
                    .catch(() => fallbackCopyText(textToCopy, setSuccessState));
            } else {
                fallbackCopyText(textToCopy, setSuccessState);
            }
        }

        function fallbackCopyText(text, callback) {
            try {
                const textArea = document.createElement('textarea');
                textArea.value = text;
                textArea.style.position = 'fixed';
                textArea.style.top = '0';
                textArea.style.left = '0';
                textArea.style.width = '2em';
                textArea.style.height = '2em';
                textArea.style.padding = '0';
                textArea.style.border = 'none';
                textArea.style.outline = 'none';
                textArea.style.boxShadow = 'none';
                textArea.style.background = 'transparent';
                textArea.style.opacity = '0';
                document.body.appendChild(textArea);
                textArea.focus();
                textArea.select();
                const successful = document.execCommand('copy');
                document.body.removeChild(textArea);
                if (successful && callback) {
                    callback();
                } else {
                    triggerToast('Не удалось скопировать код');
                }
            } catch (err) {
                console.error('Fallback copy error:', err);
                triggerToast('Ошибка копирования');
            }
        }

        function formatMarkdown(text) {
            if (!text) return '';

            const codeBlocks = [];

            // 1. Extract triple-backtick code blocks safely with header and Copy button
            let parsed = text.replace(/```([a-zA-Z0-9_+#.-]*)\n?([\s\S]*?)```/g, (match, lang, code) => {
                const cleanLang = (lang || '').trim();
                const displayLang = cleanLang ? cleanLang.toUpperCase() : 'КОД';
                const rawCode = code.trim();
                const placeholder = `___CODE_BLOCK_${codeBlocks.length}___`;

                const blockHtml = `
                    <div class="code-block-wrapper">
                        <div class="code-block-header">
                            <span class="code-lang-label">${escapeHtml(displayLang)}</span>
                            <button class="code-copy-btn" type="button" onclick="handleCopyCode(this)" title="Копировать код">
                                <svg class="copy-icon" width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect width="14" height="14" x="8" y="8" rx="2" ry="2"/><path d="M4 16c-1.1 0-2-.9-2-2V4c0-1.1.9-2 2-2h10c1.1 0 2 .9 2 2"/></svg>
                                <svg class="check-icon" width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" style="display:none;"><polyline points="20 6 9 17 4 12"/></svg>
                                <span class="copy-btn-text">Копировать</span>
                            </button>
                        </div>
                        <pre><code class="language-${escapeHtml(cleanLang.toLowerCase())}">${escapeHtml(rawCode)}</code></pre>
                    </div>
                `;
                codeBlocks.push(blockHtml);
                return placeholder;
            });

            // 2. Format inline markdown
            parsed = parsed
                .replace(/`([^`]+)`/g, (m, inline) => `<code>${escapeHtml(inline)}</code>`)
                .replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>')
                .replace(/\*([^*]+)\*/g, '<em>$1</em>')
                .replace(/\n\n/g, '<p></p>')
                .replace(/\n/g, '<br>');

            // 3. Restore code blocks untouched
            codeBlocks.forEach((blockHtml, index) => {
                parsed = parsed.replace(`___CODE_BLOCK_${index}___`, blockHtml);
            });

            return parsed;
        }

        // ==========================================
        // 10 WELCOME PHRASES ENGINE (Smooth Auto-Cycle Transition)
        // ==========================================
        function setWelcomePhrase(index, animate = true) {
            if (isPhraseTransitioning) return;
            if (index < 0 || index >= WELCOME_PHRASES.length) return;

            const heading = document.getElementById('welcomeHeading');
            if (!heading) return;

            currentWelcomePhraseIndex = index;

            if (!animate) {
                heading.textContent = WELCOME_PHRASES[index];
                return;
            }

            isPhraseTransitioning = true;
            heading.classList.remove('anim-in');
            heading.classList.add('anim-out');

            setTimeout(() => {
                heading.textContent = WELCOME_PHRASES[index];
                heading.classList.remove('anim-out');
                // Force reflow to cleanly restart the entrance animation
                void heading.offsetWidth;
                heading.classList.add('anim-in');

                setTimeout(() => {
                    isPhraseTransitioning = false;
                }, 400);
            }, 350);
        }

        function cycleNextWelcomePhrase() {
            if (isPhraseTransitioning) return;
            const nextIndex = (currentWelcomePhraseIndex + 1) % WELCOME_PHRASES.length;
            setWelcomePhrase(nextIndex, true);
        }

        function initWelcomePhrase() {
            // Pick a random phrase out of the 10 phrases upon opening
            const randomIndex = Math.floor(Math.random() * WELCOME_PHRASES.length);
            currentWelcomePhraseIndex = randomIndex;

            const heading = document.getElementById('welcomeHeading');
            if (heading) {
                heading.textContent = WELCOME_PHRASES[randomIndex];
                heading.classList.remove('anim-out');
                heading.classList.remove('anim-in');
                // Force reflow for seamless entrance animation
                void heading.offsetWidth;
                heading.classList.add('anim-in');
            }

            startWelcomePhraseAutoCycle();
        }

        function startWelcomePhraseAutoCycle() {
            if (welcomePhraseTimer) clearInterval(welcomePhraseTimer);
            welcomePhraseTimer = setInterval(() => {
                const welcome = document.getElementById('welcomeView');
                // Auto-cycle only while welcome view is visible
                if (welcome && welcome.style.display !== 'none' && !isPhraseTransitioning) {
                    cycleNextWelcomePhrase();
                }
            }, 3800);
        }

        // Initialize dynamic components on load
        document.addEventListener('DOMContentLoaded', () => {
            renderHistoryList();
            updateSettingsVisualIndicators();
            setupDragAndDrop();
            setupPasteListener();
            initWelcomePhrase();
        });
    </script>
