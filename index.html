<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quanta AI — Ultimate Edition</title>
    <meta name="description" content="Quanta — AI-платформа: чат, анализ документов, генерация изображений, Data Science и код.">
    
    <!-- Шрифты и Иконки -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    
    <!-- Подсветка синтаксиса (Тема One Dark) -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/atom-one-dark.min.css">

    <style>
        /* ==========================================
           1. ПЕРЕМЕННЫЕ И БАЗОВЫЙ СБРОС
           ========================================== */
        :root {
            --bg-root: #09090b;
            --bg-sidebar: #121214;
            --bg-chat: #18181b;
            --bg-input: #27272a;
            --bg-hover: #3f3f46;
            --text-main: #f4f4f5;
            --text-muted: #a1a1aa;
            --accent: #6366f1;
            --accent-hover: #818cf8;
            --border: #27272a;
            --success: #10b981;
            --danger: #ef4444;
            --warning: #f59e0b;
            
            --sidebar-width: 280px;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--bg-root);
            color: var(--text-main);
            height: 100vh;
            display: flex;
            overflow: hidden;
        }

        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #3f3f46; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #52525b; }

        button { font-family: inherit; cursor: pointer; border: none; outline: none; background: none; }
        a { color: var(--accent); text-decoration: none; }
        a:hover { text-decoration: underline; }

        /* ==========================================
           2. БОКОВАЯ ПАНЕЛЬ (SIDEBAR)
           ========================================== */
        .sidebar {
            width: var(--sidebar-width);
            background-color: var(--bg-sidebar);
            border-right: 1px solid var(--border);
            display: flex;
            flex-direction: column;
            transition: transform 0.3s ease;
            z-index: 100;
        }

        .sidebar-header {
            padding: 20px;
            border-bottom: 1px solid var(--border);
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .logo-wrapper {
            display: flex;
            align-items: center;
            gap: 12px;
            font-weight: 700;
            font-size: 1.2rem;
        }

        .logo-icon {
            width: 32px; height: 32px;
            background: linear-gradient(135deg, var(--accent), #a855f7);
            border-radius: 8px; display: flex; align-items: center; justify-content: center;
            color: white; font-size: 1rem;
        }

        .new-chat-btn {
            width: calc(100% - 40px);
            margin: 20px auto;
            padding: 12px;
            background-color: var(--bg-input);
            color: var(--text-main);
            border: 1px solid var(--border);
            border-radius: 8px;
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 0.95rem;
            transition: all 0.2s;
        }

        .new-chat-btn:hover { background-color: var(--bg-hover); }

        .chat-history-list {
            flex: 1;
            overflow-y: auto;
            padding: 0 12px;
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .history-item {
            padding: 10px 12px;
            border-radius: 6px;
            color: var(--text-muted);
            font-size: 0.9rem;
            display: flex;
            align-items: center;
            gap: 10px;
            cursor: pointer;
            transition: all 0.2s;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .history-item:hover { background-color: var(--bg-input); color: var(--text-main); }
        .history-item.active { background-color: var(--bg-input); color: var(--text-main); font-weight: 500; }

        .sidebar-footer {
            padding: 20px;
            border-top: 1px solid var(--border);
            font-size: 0.8rem;
            color: var(--text-muted);
        }

        .puter-status {
            display: flex; align-items: center; gap: 8px; margin-top: 12px;
            padding: 8px; border-radius: 6px; background: rgba(16, 185, 129, 0.1);
            color: var(--success); cursor: pointer;
            border: 1px solid rgba(16, 185, 129, 0.2);
        }
        .puter-status.offline {
            background: rgba(239, 68, 68, 0.1); color: var(--danger);
            border-color: rgba(239, 68, 68, 0.2);
        }

        /* ==========================================
           3. ГЛАВНАЯ ОБЛАСТЬ (MAIN CONTENT)
           ========================================== */
        .main-view {
            flex: 1;
            display: flex;
            flex-direction: column;
            background-color: var(--bg-chat);
            position: relative;
        }

        /* Верхняя панель мобильная */
        .mobile-header {
            display: none;
            padding: 16px 20px;
            background: var(--bg-sidebar);
            border-bottom: 1px solid var(--border);
            align-items: center;
            justify-content: space-between;
        }

        /* Окно чата */
        .chat-container {
            flex: 1;
            overflow-y: auto;
            padding: 40px 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            scroll-behavior: smooth;
        }

        .chat-messages {
            width: 100%;
            max-width: 800px;
            display: flex;
            flex-direction: column;
            gap: 32px;
        }

        /* Пустой экран (Hero) */
        .empty-state {
            margin-top: 10vh;
            text-align: center;
            width: 100%;
            max-width: 600px;
        }
        
        .empty-state h1 { font-size: 3rem; font-weight: 700; margin-bottom: 16px; background: linear-gradient(135deg, #fff, #a1a1aa); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        .empty-state p { color: var(--text-muted); font-size: 1.1rem; margin-bottom: 40px; }

        .quick-actions-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
            gap: 12px;
        }

        .action-card {
            background: var(--bg-input);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 16px;
            text-align: left;
            cursor: pointer;
            transition: all 0.2s;
        }
        .action-card:hover { border-color: var(--accent); background: var(--bg-hover); transform: translateY(-2px); }
        .action-card svg { width: 20px; height: 20px; color: var(--accent); margin-bottom: 8px; }
        .action-card span { display: block; font-size: 0.9rem; color: var(--text-main); font-weight: 500; }

        /* ==========================================
           4. СООБЩЕНИЯ (MESSAGES & MARKDOWN)
           ========================================== */
        .message-row { display: flex; gap: 16px; width: 100%; }
        .message-avatar { width: 36px; height: 36px; border-radius: 8px; flex-shrink: 0; display: flex; align-items: center; justify-content: center; font-size: 1.2rem; }
        .avatar-user { background: var(--bg-hover); color: white; }
        .avatar-ai { background: linear-gradient(135deg, var(--accent), #a855f7); color: white; }
        
        .message-content { flex: 1; min-width: 0; padding-top: 6px; }
        .message-name { font-size: 0.8rem; font-weight: 600; color: var(--text-muted); margin-bottom: 4px; text-transform: uppercase; letter-spacing: 0.5px; }
        
        .markdown-body { font-size: 1rem; line-height: 1.6; color: var(--text-main); word-wrap: break-word; }
        .markdown-body p { margin-bottom: 16px; }
        .markdown-body p:last-child { margin-bottom: 0; }
        .markdown-body ul, .markdown-body ol { margin-bottom: 16px; padding-left: 24px; }
        .markdown-body li { margin-bottom: 6px; }
        .markdown-body h1, .markdown-body h2, .markdown-body h3 { margin-top: 24px; margin-bottom: 12px; font-weight: 600; color: #fff; }
        
        .markdown-body img { max-width: 100%; border-radius: 12px; border: 1px solid var(--border); margin: 12px 0; }
        .markdown-body table { width: 100%; border-collapse: collapse; margin: 16px 0; border-radius: 8px; overflow: hidden; }
        .markdown-body th, .markdown-body td { border: 1px solid var(--border); padding: 10px 14px; text-align: left; }
        .markdown-body th { background: var(--bg-input); font-weight: 600; }

        /* Идеальный блок кода */
        .code-block-wrapper { margin: 16px 0; border-radius: 12px; overflow: hidden; border: 1px solid var(--border); background: #282c34; }
        .code-block-header { display: flex; justify-content: space-between; align-items: center; background: #21252b; padding: 8px 16px; border-bottom: 1px solid #181a1f; }
        .code-lang { font-family: 'JetBrains Mono', monospace; font-size: 0.75rem; color: #abb2bf; text-transform: uppercase; }
        .code-actions { display: flex; gap: 8px; }
        .code-btn { padding: 4px 10px; border-radius: 6px; font-size: 0.75rem; color: #abb2bf; border: 1px solid #3e4451; transition: 0.2s; display: flex; align-items: center; gap: 4px; }
        .code-btn:hover { background: #3e4451; color: white; }
        .code-btn.download { background: var(--accent); border-color: var(--accent); color: white; }
        .code-btn.download:hover { background: var(--accent-hover); }
        .code-block-wrapper pre { margin: 0; padding: 16px; overflow-x: auto; }
        .code-block-wrapper code { font-family: 'JetBrains Mono', monospace; font-size: 0.9rem; line-height: 1.5; }
        
        /* Инлайн код */
        .markdown-body p code, .markdown-body li code { background: var(--bg-hover); padding: 3px 6px; border-radius: 6px; font-family: 'JetBrains Mono', monospace; font-size: 0.85em; color: var(--accent-hover); }

        .typing-indicator { display: flex; align-items: center; gap: 8px; color: var(--text-muted); font-size: 0.9rem; }
        .spinner { width: 16px; height: 16px; border: 2px solid var(--border); border-top-color: var(--accent); border-radius: 50%; animation: spin 1s linear infinite; }
        @keyframes spin { to { transform: rotate(360deg); } }

        /* ==========================================
           5. ОБЛАСТЬ ВВОДА (INPUT ZONE)
           ========================================== */
        .input-zone {
            padding: 20px;
            background: linear-gradient(0deg, var(--bg-chat) 70%, transparent);
            display: flex;
            justify-content: center;
            position: relative;
        }

        .input-box {
            width: 100%;
            max-width: 800px;
            background: var(--bg-input);
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 12px 16px;
            display: flex;
            flex-direction: column;
            box-shadow: 0 4px 20px rgba(0,0,0,0.3);
            transition: all 0.3s;
        }
        .input-box:focus-within { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-glow); }

        .attachment-preview {
            display: none; align-items: center; gap: 12px; padding-bottom: 12px; margin-bottom: 12px; border-bottom: 1px solid var(--border);
        }
        .attachment-preview img { width: 40px; height: 40px; border-radius: 8px; object-fit: cover; }
        .attachment-info { flex: 1; font-size: 0.85rem; color: var(--text-main); }
        .attachment-remove { color: var(--text-muted); cursor: pointer; padding: 4px; border-radius: 4px; }
        .attachment-remove:hover { color: var(--danger); background: var(--bg-hover); }

        textarea {
            width: 100%; background: transparent; border: none; outline: none;
            color: var(--text-main); font-family: inherit; font-size: 1rem;
            resize: none; min-height: 24px; max-height: 200px; line-height: 1.5;
        }
        textarea::placeholder { color: var(--text-muted); }

        .input-controls {
            display: flex; justify-content: space-between; align-items: center; margin-top: 10px;
        }

        .control-group { display: flex; gap: 4px; align-items: center; }
        
        .tool-btn {
            width: 32px; height: 32px; border-radius: 8px; display: flex; align-items: center; justify-content: center;
            color: var(--text-muted); transition: 0.2s;
        }
        .tool-btn:hover { background: var(--bg-hover); color: var(--text-main); }
        .tool-btn svg { width: 18px; height: 18px; }

        .model-selector {
            display: flex; align-items: center; gap: 6px; padding: 6px 12px; border-radius: 8px;
            color: var(--text-muted); font-size: 0.85rem; cursor: pointer; transition: 0.2s;
        }
        .model-selector:hover { background: var(--bg-hover); color: var(--text-main); }

        .send-btn {
            width: 36px; height: 36px; border-radius: 10px; background: var(--text-main); color: var(--bg-root);
            display: flex; align-items: center; justify-content: center; transition: 0.2s;
        }
        .send-btn:hover { transform: scale(1.05); background: #fff; }
        .send-btn:disabled { opacity: 0.5; cursor: not-allowed; transform: none; }

        /* ==========================================
           6. УТИЛИТЫ И МОБИЛЬНАЯ ВЕРСТКА
           ========================================== */
        .toast {
            position: fixed; top: 24px; left: 50%; transform: translate(-50%, -100px);
            background: var(--bg-sidebar); border: 1px solid var(--border); padding: 12px 24px;
            border-radius: 50px; font-size: 0.9rem; color: var(--text-main); z-index: 1000;
            opacity: 0; transition: all 0.4s cubic-bezier(0.68, -0.55, 0.265, 1.55);
            box-shadow: 0 10px 30px rgba(0,0,0,0.5); display: flex; align-items: center; gap: 8px;
        }
        .toast.show { transform: translate(-50%, 0); opacity: 1; }

        @media (max-width: 768px) {
            .sidebar { position: fixed; transform: translateX(-100%); height: 100%; }
            .sidebar.open { transform: translateX(0); }
            .mobile-header { display: flex; }
            .empty-state h1 { font-size: 2.2rem; }
            .message-avatar { width: 28px; height: 28px; font-size: 1rem; }
            .input-zone { padding: 12px; }
        }
    </style>
</head>
<body>

    <!-- SIDEBAR: ИСТОРИЯ И НАСТРОЙКИ -->
    <aside class="sidebar" id="sidebar">
        <div class="sidebar-header">
            <div class="logo-wrapper">
                <div class="logo-icon">Q</div>
                <span>Quanta Pro</span>
            </div>
            <button class="tool-btn d-md-none" onclick="toggleSidebar()" style="display: none;">✕</button>
        </div>
        
        <button class="new-chat-btn" onclick="startNewChat()">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></svg>
            Новый диалог
        </button>

        <div class="chat-history-list" id="chatHistoryList">
            <!-- Список чатов генерируется через JS -->
        </div>

        <div class="sidebar-footer">
            <p>Модули и Интеграции:</p>
            <div class="puter-status offline" id="puterStatus" onclick="handlePuterAuth()">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor"><circle cx="12" cy="12" r="10"/></svg>
                <span id="puterStatusText">Puter: Не подключен</span>
            </div>
        </div>
    </aside>

    <!-- ГЛАВНАЯ ОБЛАСТЬ -->
    <main class="main-view">
        
        <div class="mobile-header">
            <button class="tool-btn" onclick="toggleSidebar()">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="3" y1="12" x2="21" y2="12"></line><line x1="3" y1="6" x2="21" y2="6"></line><line x1="3" y1="18" x2="21" y2="18"></line></svg>
            </button>
            <span style="font-weight: 600;">Quanta AI</span>
            <button class="tool-btn" onclick="startNewChat()">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"></path><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"></path></svg>
            </button>
        </div>

        <div class="chat-container" id="chatContainer">
            <!-- Стартовый экран (Hero) -->
            <div class="empty-state" id="emptyState">
                <div class="logo-icon" style="width: 56px; height: 56px; font-size: 2rem; margin: 0 auto 20px;">Q</div>
                <h1>Чем я могу помочь?</h1>
                <p>Пишите код, анализируйте таблицы, создавайте презентации или генерируйте изображения.</p>
                
                <div class="quick-actions-grid">
                    <div class="action-card" onclick="insertPrompt('Напиши змейку на Python используя pygame. Выдай полный код.')">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="16 18 22 12 16 6"></polyline><polyline points="8 6 2 12 8 18"></polyline></svg>
                        <span>Написать код</span>
                    </div>
                    <div class="action-card" onclick="insertPrompt('Сделай подробную презентацию на тему «Колонизация Марса»')">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="2" y="3" width="20" height="14" rx="2"></rect><line x1="8" y1="21" x2="16" y2="21"></line><line x1="12" y1="17" x2="12" y2="21"></line></svg>
                        <span>Создать Слайды</span>
                    </div>
                    <div class="action-card" onclick="insertPrompt('Нарисуй киберпанк город будущего, неоновый свет, дождь, кинематографично')">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect><circle cx="8.5" cy="8.5" r="1.5"></circle><polyline points="21 15 16 10 5 21"></polyline></svg>
                        <span>Сгенерировать Арт</span>
                    </div>
                    <div class="action-card" onclick="document.getElementById('fileInput').click()">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="2"></rect><line x1="3" y1="9" x2="21" y2="9"></line><line x1="9" y1="21" x2="9" y2="9"></line></svg>
                        <span>Анализ Таблиц</span>
                    </div>
                </div>
            </div>

            <!-- Область вывода сообщений -->
            <div class="chat-messages" id="chatMessages" style="display: none;">
                <!-- Динамические сообщения -->
            </div>
        </div>

        <!-- Зона ввода внизу -->
        <div class="input-zone">
            <div class="input-box">
                <!-- Превью файлов -->
                <div class="attachment-preview" id="attachmentPreview">
                    <img id="attachImg" src="" alt="File">
                    <div class="attachment-info" id="attachName">file.png</div>
                    <button class="attachment-remove" onclick="removeAttachment()">✕</button>
                </div>

                <textarea id="mainInput" placeholder="Отправьте сообщение Quanta..." rows="1"></textarea>
                
                <div class="input-controls">
                    <div class="control-group">
                        <button class="tool-btn" onclick="document.getElementById('fileInput').click()" title="Прикрепить документ (PDF, Excel, Фото)">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21.44 11.05l-9.19 9.19a6 6 0 0 1-8.49-8.49l9.19-9.19a4 4 0 0 1 5.66 5.66l-9.2 9.19a2 2 0 0 1-2.83-2.83l8.49-8.48"></path></svg>
                        </button>
                        <button class="tool-btn" onclick="startVoiceInput()" id="voiceBtn" title="Голосовой ввод">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"></path><path d="M19 10v2a7 7 0 0 1-14 0v-2"></path><line x1="12" y1="19" x2="12" y2="23"></line><line x1="8" y1="23" x2="16" y2="23"></line></svg>
                        </button>
                    </div>

                    <div class="control-group">
                        <button class="model-selector" onclick="toggleAIModel()" title="Выбрать интеллект">
                            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"></polygon></svg>
                            <span id="modelIndicator">Быстрый (GPT-4o mini)</span>
                        </button>
                        <button class="send-btn" id="sendBtn" onclick="handleChatSubmit()">
                            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="22" y1="2" x2="11" y2="13"></line><polygon points="22 2 15 22 11 13 2 9 22 2"></polygon></svg>
                        </button>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <!-- Скрытые элементы -->
    <input type="file" id="fileInput" style="display:none" accept=".pdf,.docx,.txt,.md,.csv,.xlsx,.xls,image/*">
    <div class="toast" id="toastBox">
        <span id="toastIcon">ℹ️</span>
        <span id="toastText">Уведомление</span>
    </div>

    <!-- ==========================================
         БИБЛИОТЕКИ CDN
         ========================================== -->
    <script src="https://js.puter.com/v2/"></script>
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
    
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/mammoth/1.6.0/mammoth.browser.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/pptxgenjs@3.12.0/dist/pptxgen.bundle.js"></script>
<!-- ==========================================================================
         ГЛАВНЫЙ JAVASCRIPT (УЛЬТИМАТИВНАЯ ЛОГИКА)
         ========================================================================== -->
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            
            // ==========================================
            // 1. ИНИЦИАЛИЗАЦИЯ И НАСТРОЙКИ
            // ==========================================
            
            // Настройка парсера Markdown для красивого кода
            marked.setOptions({
                highlight: function(code, lang) {
                    const language = hljs.getLanguage(lang) ? lang : 'plaintext';
                    return hljs.highlight(code, { language }).value;
                },
                breaks: true,
                gfm: true
            });

            // Генерация частиц на фоне
            function initParticles() {
                const container = document.getElementById('particles');
                for (let i = 0; i < 40; i++) {
                    const p = document.createElement('div');
                    p.className = 'particle';
                    p.style.left = Math.random() * 100 + '%';
                    p.style.animationDelay = Math.random() * 20 + 's';
                    p.style.animationDuration = (15 + Math.random() * 10) + 's';
                    container.appendChild(p);
                }
            }
            initParticles();

            // ==========================================
            // 2. ГЛОБАЛЬНОЕ СОСТОЯНИЕ (STATE)
            // ==========================================
            let currentChatId = Date.now().toString();
            let chats = JSON.parse(localStorage.getItem('quanta_chats')) || {};
            let pendingImage = null; // Хранилище для прикрепленного фото
            
            // Модели ИИ (С каскадным Ультра-режимом)
            const AI_MODELS = {
                quick: 'gpt-4o-mini',
                deep: 'gpt-4o',
                // Каскад: если первый недоступен, пробуем второй, затем третий
                ultraFallback: ['claude-3-5-sonnet', 'google/gemini-1.5-pro', 'gpt-4o'] 
            };
            let activeMode = 'quick';
            const modeLabels = { quick: 'Быстрый (GPT-4o mini)', deep: 'Глубокий (GPT-4o)', ultra: 'Ультра (Smart Router)' };

            // ==========================================
            // 3. UI УТИЛИТЫ И ИНТЕРФЕЙС
            // ==========================================
            
            window.showToast = function(message, isError = false) {
                const toast = document.getElementById('toastBox');
                document.getElementById('toastIcon').textContent = isError ? '⚠️' : '✅';
                document.getElementById('toastText').textContent = message;
                
                toast.style.borderColor = isError ? 'var(--danger)' : 'var(--border)';
                toast.classList.add('show');
                setTimeout(() => toast.classList.remove('show'), 3500);
            }

            window.toggleSidebar = function() {
                document.getElementById('sidebar').classList.toggle('open');
            }

            // Авторасширение поля ввода
            const textarea = document.getElementById('mainInput');
            textarea.addEventListener('input', function() {
                this.style.height = 'auto';
                this.style.height = (this.scrollHeight) + 'px';
                if (this.value.trim() === '') this.style.height = 'auto';
            });

            // ==========================================
            // 4. ПАМЯТЬ ЧАТА (СЕССИИ LOCAL STORAGE)
            // ==========================================
            
            function saveChats() {
                localStorage.setItem('quanta_chats', JSON.stringify(chats));
                renderChatHistoryList();
            }

            function renderChatHistoryList() {
                const list = document.getElementById('chatHistoryList');
                list.innerHTML = '';
                
                Object.keys(chats).sort((a,b) => b - a).forEach(id => {
                    const session = chats[id];
                    if (session.messages.length === 0) return;
                    
                    // Берем первое сообщение как заголовок чата
                    const title = session.messages.find(m => m.role === 'user')?.content.substring(0, 25) || 'Новый диалог';
                    
                    const item = document.createElement('div');
                    item.className = `history-item ${id === currentChatId ? 'active' : ''}`;
                    item.innerHTML = `<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"></path></svg> ${escapeHtml(title)}...`;
                    item.onclick = () => loadChat(id);
                    list.appendChild(item);
                });
            }

            window.startNewChat = function() {
                currentChatId = Date.now().toString();
                chats[currentChatId] = { messages: [] };
                
                document.getElementById('chatMessages').innerHTML = '';
                document.getElementById('chatMessages').style.display = 'none';
                document.getElementById('emptyState').style.display = 'block';
                
                if (window.innerWidth <= 768) toggleSidebar();
                renderChatHistoryList();
            }

            function loadChat(id) {
                currentChatId = id;
                const session = chats[id];
                
                document.getElementById('emptyState').style.display = 'none';
                const msgContainer = document.getElementById('chatMessages');
                msgContainer.style.display = 'flex';
                msgContainer.innerHTML = '';
                
                session.messages.forEach(msg => {
                    if (msg.role !== 'system') appendMessageUI(msg.role, msg.html || renderMarkdown(msg.content));
                });
                
                if (window.innerWidth <= 768) toggleSidebar();
                renderChatHistoryList();
                
                // Применяем подсветку синтаксиса
                document.querySelectorAll('pre code').forEach(el => hljs.highlightElement(el));
            }

            // Инициализация при загрузке
            if (!chats[currentChatId]) chats[currentChatId] = { messages: [] };
            renderChatHistoryList();

            // ==========================================
            // 5. AI PUTER AUTH И SMART ROUTER
            // ==========================================

            async function updateAuthUI() {
                const btn = document.getElementById('puterStatus');
                const text = document.getElementById('puterStatusText');
                if (typeof puter === 'undefined') return;
                
                try {
                    if (await puter.auth.isSignedIn()) {
                        btn.classList.remove('offline');
                        text.textContent = 'Puter: Подключен';
                    } else {
                        btn.classList.add('offline');
                        text.textContent = 'Puter: Требуется вход';
                    }
                } catch (e) { console.error('Auth error', e); }
            }

            window.handlePuterAuth = async function() {
                if (typeof puter === 'undefined') return showToast('Скрипт Puter заблокирован', true);
                try {
                    if (!await puter.auth.isSignedIn()) {
                        await puter.auth.signIn();
                        showToast('Вы успешно авторизовались!');
                    } else {
                        showToast('Нейросеть уже готова к работе.');
                    }
                } catch (e) { showToast('Авторизация отменена', true); }
                updateAuthUI();
            }
            setTimeout(updateAuthUI, 1000);

            window.toggleAIModel = function() {
                const label = document.getElementById('modelIndicator');
                if (activeMode === 'quick') {
                    activeMode = 'deep';
                } else if (activeMode === 'deep') {
                    activeMode = 'ultra';
                    label.style.color = 'var(--accent-hover)';
                    label.style.fontWeight = '600';
                } else {
                    activeMode = 'quick';
                    label.style.color = '';
                    label.style.fontWeight = '';
                }
                label.textContent = modeLabels[activeMode];
                showToast(`Переключено на: ${modeLabels[activeMode]}`);
            }

            // Тот самый Smart Router для Ультра-режима
            async function smartAIFetch(messagesPayload) {
                if (typeof puter === 'undefined') throw new Error('API недоступно. Выключите AdBlock.');
                
                if (activeMode !== 'ultra') {
                    // Обычный запрос для Quick и Deep
                    const res = await puter.ai.chat(messagesPayload, { model: AI_MODELS[activeMode] });
                    return typeof res === 'string' ? res : (res?.message?.content || res?.text);
                }

                // УЛЬТРА КАСКАД: Пытаемся пробиться через топовые модели
                for (const modelId of AI_MODELS.ultraFallback) {
                    try {
                        console.log(`[Smart Router] Пытаюсь использовать: ${modelId}`);
                        const res = await puter.ai.chat(messagesPayload, { model: modelId });
                        return typeof res === 'string' ? res : (res?.message?.content || res?.text);
                    } catch (error) {
                        console.warn(`[Smart Router] Модель ${modelId} недоступна:`, error.message);
                        // Идем к следующей модели в цикле
                    }
                }
                
                throw new Error('Все Ultra-модели в данный момент перегружены сервером. Переключитесь на Глубокий режим.');
            }

            // ==========================================
            // 6. РЕНДЕР СООБЩЕНИЙ И КОДА (IDE STYLE)
            // ==========================================
            
            function escapeHtml(str) { 
                return String(str).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); 
            }

            let codeSnippetId = 0;
            
            function renderMarkdown(rawText) {
                let html = marked.parse(rawText);
                
                // Преобразуем блоки кода в красивые IDE-окна с кнопками
                html = html.replace(/<pre><code class="language-(\w+)">([\s\S]*?)<\/code><\/pre>/gi, (match, lang, code) => {
                    const id = 'snippet_' + (++codeSnippetId);
                    const ext = lang.toLowerCase() || 'txt';
                    return `
                    <div class="code-block-wrapper">
                        <div class="code-block-header">
                            <span class="code-lang">${ext}</span>
                            <div class="code-actions">
                                <button class="code-btn" onclick="copyCode('${id}')">📋 Копировать</button>
                                <button class="code-btn download" onclick="downloadCode('${id}', '${ext}')">💾 Сохранить</button>
                            </div>
                        </div>
                        <pre><code id="${id}" class="hljs language-${ext}">${code}</code></pre>
                    </div>`;
                });

                // Блоки кода без языка
                html = html.replace(/<pre><code>([\s\S]*?)<\/code><\/pre>/gi, (match, code) => {
                    const id = 'snippet_' + (++codeSnippetId);
                    return `
                    <div class="code-block-wrapper">
                        <div class="code-block-header">
                            <span class="code-lang">TEXT</span>
                            <div class="code-actions">
                                <button class="code-btn download" onclick="downloadCode('${id}', 'txt')">💾 Сохранить</button>
                            </div>
                        </div>
                        <pre><code id="${id}">${code}</code></pre>
                    </div>`;
                });

                return html;
            }

            window.copyCode = function(id) {
                const el = document.getElementById(id);
                if (el) {
                    navigator.clipboard.writeText(el.innerText);
                    showToast('Код скопирован в буфер обмена');
                }
            }

            window.downloadCode = function(id, ext) {
                const el = document.getElementById(id);
                if (!el) return;
                const blob = new Blob([el.innerText], { type: 'text/plain;charset=utf-8' });
                const url = URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url; 
                a.download = `quanta_script.${ext}`; 
                document.body.appendChild(a);
                a.click(); 
                a.remove(); 
                URL.revokeObjectURL(url);
                showToast(`Файл quanta_script.${ext} скачан!`);
            }

            function appendMessageUI(role, htmlContent) {
                const container = document.getElementById('chatMessages');
                const div = document.createElement('div');
                div.className = 'message-row animate-in';
                
                const isUser = role === 'user';
                div.innerHTML = `
                    <div class="message-avatar ${isUser ? 'avatar-user' : 'avatar-ai'}">
                        ${isUser ? '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path><circle cx="12" cy="7" r="4"></circle></svg>' : 'Q'}
                    </div>
                    <div class="message-content">
                        <div class="message-name">${isUser ? 'Вы' : 'Quanta AI'}</div>
                        <div class="markdown-body">${htmlContent}</div>
                    </div>
                `;
                container.appendChild(div);
                
                // Плавный скролл вниз
                const chatContainer = document.getElementById('chatContainer');
                chatContainer.scrollTop = chatContainer.scrollHeight;
                
                return div.querySelector('.markdown-body');
            }

            function showLoader(text) {
                return appendMessageUI('ai', `<div class="typing-indicator"><div class="spinner"></div> ${text}</div>`);
            }

            // ==========================================
            // 7. ЛОГИКА ОТПРАВКИ И ОБРАБОТКИ
            // ==========================================
            
            window.handleChatSubmit = async function() {
                const inputEl = document.getElementById('mainInput');
                const text = inputEl.value.trim();
                const textLower = text.toLowerCase();
                const sendBtn = document.getElementById('sendBtn');

                // Проверка: Фото + Текст
                if (pendingImage) {
                    const img = pendingImage;
                    removePendingImage();
                    inputEl.value = '';
                    inputEl.style.height = 'auto';
                    
                    document.getElementById('emptyState').style.display = 'none';
                    document.getElementById('chatMessages').style.display = 'flex';

                    const displayHtml = `<img src="${img.dataUrl}" style="max-width:300px;"><br>${escapeHtml(text || 'Проанализируй изображение')}`;
                    appendMessageUI('user', displayHtml);
                    
                    // Сохраняем в историю (без base64 чтобы не забить память, храним только факт запроса)
                    chats[currentChatId].messages.push({ role: 'user', content: text || '[Изображение отправлено]', html: displayHtml });
                    
                    const loader = showLoader('Изучаю изображение (Vision AI)...');
                    sendBtn.disabled = true;

                    try {
                        // Vision запрос всегда идет через топовую доступную модель в Puter
                        const response = await puter.ai.chat(text || 'Опиши детально это фото', img.dataUrl, false);
                        const answer = typeof response === 'string' ? response : (response?.message?.content || response?.text);
                        
                        const htmlAnswer = renderMarkdown(answer);
                        loader.innerHTML = htmlAnswer;
                        
                        chats[currentChatId].messages.push({ role: 'assistant', content: answer, html: htmlAnswer });
                        saveChats();
                        document.querySelectorAll('pre code').forEach(el => hljs.highlightElement(el));
                    } catch (e) {
                        loader.innerHTML = `<span style="color:var(--danger)">⚠️ Ошибка Vision: ${escapeHtml(e.message)}</span>`;
                        showToast('Сбой анализа изображения', true);
                    }
                    sendBtn.disabled = false;
                    return;
                }

                if (!text) return;

                // Очистка UI перед отправкой
                document.getElementById('emptyState').style.display = 'none';
                document.getElementById('chatMessages').style.display = 'flex';
                inputEl.value = '';
                inputEl.style.height = 'auto';
                sendBtn.disabled = true;

                appendMessageUI('user', escapeHtml(text));
                chats[currentChatId].messages.push({ role: 'user', content: text });

                // ТРИГГЕР 1: ГЕНЕРАЦИЯ КАРТИНОК (Прямой вызов)
                if (textLower.startsWith('нарисуй') || textLower.startsWith('сгенерируй') || textLower.startsWith('сделай арт')) {
                    const loader = showLoader('🎨 Рисую шедевр...');
                    try {
                        // Используем нативный txt2img. Puter сам решит, какую модель юзать (DALL-E 3 или SD)
                        const imgRes = await puter.ai.txt2img(text);
                        const src = imgRes?.src || (typeof imgRes === 'string' ? imgRes : null);
                        
                        if (!src) throw new Error('Сервер не вернул изображение');
                        
                        const resultHtml = `
                            <p>Вот ваше изображение:</p>
                            <img src="${src}" alt="AI Generated Art">
                            <br>
                            <button class="ws-download" style="margin-top:12px; background:var(--success);" onclick="window.open('${src}', '_blank')">💾 Скачать оригинал</button>
                        `;
                        loader.innerHTML = resultHtml;
                        chats[currentChatId].messages.push({ role: 'assistant', content: '[Изображение сгенерировано]', html: resultHtml });
                        saveChats();
                    } catch (e) {
                        loader.innerHTML = `<span style="color:var(--danger)">⚠️ Ошибка генерации: ${escapeHtml(e.message)}</span>`;
                    }
                    sendBtn.disabled = false;
                    return;
                }

                // ТРИГГЕР 2: ПРЕЗЕНТАЦИИ (Будет в Части 3)
                if (textLower.includes('презентаци') || textLower.includes('слайды')) {
                    await handlePresentationLogic(text, sendBtn);
                    return;
                }

                // ОБЫЧНЫЙ ТЕКСТОВЫЙ ЗАПРОС С ПАМЯТЬЮ
                const loader = showLoader('Анализирую...');
                try {
                    // Системный промпт для программиста без лимитов
                    const sysPrompt = { 
                        role: 'system', 
                        content: "Ты — Senior Developer & Expert AI. Отвечай максимально глубоко. ЕСЛИ ПИШЕШЬ КОД: выдавай его ПОЛНОСТЬЮ, от первой до последней строки. КАТЕГОРИЧЕСКИ ЗАПРЕЩЕНО писать комментарии вроде '// остальной код здесь', сокращать массивы или обрывать функции. Оформляй код в markdown блоки ```lang." 
                    };
                    
                    // Собираем контекст для отправки
                    let payload = [sysPrompt, ...chats[currentChatId].messages.filter(m => m.role !== 'system')];
                    // Ограничиваем историю 15 последними сообщениями для экономии токенов
                    if (payload.length > 15) payload = [sysPrompt, ...payload.slice(-14)];

                    // Вызываем умный роутер
                    const answer = await smartAIFetch(payload);
                    
                    const htmlAnswer = renderMarkdown(answer);
                    loader.innerHTML = htmlAnswer;
                    
                    chats[currentChatId].messages.push({ role: 'assistant', content: answer, html: htmlAnswer });
                    saveChats();
                    
                    // Подсветка нового кода
                    document.querySelectorAll('pre code').forEach(el => hljs.highlightElement(el));

                } catch (e) {
                    loader.innerHTML = `<span style="color:var(--danger)">⚠️ Сбой нейросети: ${escapeHtml(e.message)}</span>`;
                }
                
                sendBtn.disabled = false;
            }

            // Быстрая вставка текста из карточек на главном экране
            window.insertPrompt = function(text) {
                document.getElementById('mainInput').value = text;
                window.handleChatSubmit();
            }
// ==========================================
            // 8. ГЕНЕРАТОР ПРЕЗЕНТАЦИЙ (PPTX)
            // ==========================================
            async function handlePresentationLogic(text, sendBtn) {
                const loader = showLoader('Архитектура слайдов (Smart Router)...');
                try {
                    // Используем строгий промпт, чтобы вытащить только JSON
                    const prompt = `Создай подробный план презентации на тему "${text}". 
ВЕРНИ ТОЛЬКО ЧИСТЫЙ JSON без markdown-разметки или лишних слов. Структура:
{
  "title": "Главное название",
  "slides": [
    { "title": "Заголовок 1", "bullets": ["Пункт 1", "Пункт 2", "Пункт 3"] },
    { "title": "Заголовок 2", "bullets": ["Пункт 1", "Пункт 2", "Пункт 3"] }
  ]
}
Сделай ровно 6-8 информативных слайдов.`;
                    
                    const raw = await smartAIFetch(prompt);
                    
                    // Защита: ищем JSON даже если ИИ добавил текст до/после
                    const jsonMatch = raw.match(/\{[\s\S]*\}/);
                    if (!jsonMatch) throw new Error('Нейросеть нарушила структуру JSON');
                    const data = JSON.parse(jsonMatch[0]);

                    const pptx = new PptxGenJS();
                    
                    // Слайд 1: Титульный
                    const titleSlide = pptx.addSlide(); 
                    titleSlide.background = { color: '0A0A0A' };
                    titleSlide.addText(data.title || text, { x: 0.5, y: 2, w: 9, h: 1.5, fontSize: 44, bold: true, color: 'FFFFFF', align: 'center' });

                    // Слайды 2+: Контент
                    (data.slides || []).forEach(s => {
                        const slide = pptx.addSlide(); 
                        slide.background = { color: '121212' };
                        
                        // Декоративная плашка для заголовка
                        slide.addShape(pptx.ShapeType.rect, { x: 0.5, y: 0.3, w: 9, h: 1, fill: '1E1E2E' });
                        slide.addText(s.title || 'Слайд', { x: 0.8, y: 0.4, w: 8.4, h: 0.8, fontSize: 28, bold: true, color: 'A78BFA' });
                        
                        // Содержимое списка
                        slide.addText((s.bullets || []).map(b => ({ text: b, options: { bullet: { type: 'number' }, breakLine: true } })), 
                            { x: 0.8, y: 1.6, w: 8.4, h: 3.5, fontSize: 18, color: 'E2E8F0', lineSpacing: 32 }
                        );
                    });

                    // Сохранение и вывод кнопки
                    const blob = await pptx.write({ outputType: 'blob' });
                    const url = URL.createObjectURL(blob);
                    
                    const htmlResult = `
                        <div style="background:var(--bg-input); padding:20px; border-radius:12px; border:1px solid var(--success); text-align:center;">
                            <div style="font-size:3rem; margin-bottom:10px;">📊</div>
                            <h3 style="color:var(--success); margin-bottom:8px;">Презентация создана!</h3>
                            <p style="color:var(--text-muted); margin-bottom:16px;"><b>Тема:</b> ${escapeHtml(data.title || text)} (${(data.slides || []).length} слайдов)</p>
                            <a href="${url}" download="Quanta_${text.replace(/\s+/g, '_').substring(0,20)}.pptx" style="display:inline-block; font-size:1rem; padding:12px 24px; background:var(--success); color:white; border-radius:8px; text-decoration:none; font-weight:600; box-shadow: 0 4px 12px rgba(16,185,129,0.3);">📥 Скачать файл .PPTX</a>
                        </div>
                    `;
                    
                    loader.innerHTML = htmlResult;
                    chats[currentChatId].messages.push({ role: 'assistant', content: '[Файл презентации]', html: htmlResult });
                    saveChats();
                } catch (e) {
                    loader.innerHTML = `<span style="color:var(--danger)">⚠️ Ошибка компиляции: ${escapeHtml(e.message)}</span>`;
                }
            }

            // ==========================================
            // 9. БЫСТРЫЕ ШАБЛОНЫ (DEEP RESEARCH И СКРАПИНГ)
            // ==========================================

            async function handleResearch(text) {
                if (!text) return showToast('Введите тему для исследования', true);
                
                openWorkspace('Deep Research Engine'); 
                addMessage('user', renderText(`🔍 Глубокий анализ темы: ${text}`)); 
                document.getElementById('mainInput').value = '';
                
                const loader = addLoading('Формирую семантическое ядро...');
                try {
                    // 1. Дробим на вопросы
                    const planRaw = await smartAIFetch(`Разбей тему "${text}" на 4 фундаментальных вопроса для исследования. ВЕРНИ ТОЛЬКО СПИСОК с новой строки, без цифр и маркировки.`);
                    const questions = planRaw.split('\n').map(s => s.replace(/^[-*\d.\s]+/, '').trim()).filter(Boolean).slice(0, 4);
                    
                    let markdownReport = `# Исследовательский отчет: ${text}\n\n`;
                    let uiHtml = `<h3>План исследования:</h3><ul>` + questions.map(q => `<li>${escapeHtml(q)}</li>`).join('') + `</ul><hr><div class="ws-loading"><div class="spinner"></div>Синтезирую данные...</div>`;
                    loader.innerHTML = uiHtml;

                    // 2. Исследуем каждый вопрос
                    for (const q of questions) {
                        const answer = await smartAIFetch(`Детально ответь на вопрос в рамках темы "${text}": ${q}`);
                        markdownReport += `## ${q}\n${answer}\n\n`;
                        uiHtml = renderMarkdown(markdownReport) + `<div class="ws-loading"><div class="spinner"></div>Синтезирую данные...</div>`;
                        loader.innerHTML = uiHtml;
                    }
                    
                    // 3. Заключение
                    const summary = await smartAIFetch(`На основе вышесказанного, напиши мощный итоговый вывод (3-4 абзаца) для темы "${text}".`);
                    markdownReport += `## Итоговое Заключение\n${summary}`;
                    
                    const finalHtml = renderMarkdown(markdownReport);
                    loader.innerHTML = finalHtml; 
                    
                    chats[currentChatId].messages.push({ role: 'assistant', content: markdownReport, html: finalHtml });
                    saveChats();
                } catch (e) { loader.innerHTML = `<span style="color:var(--danger)">⚠️ Сбой исследования: ${escapeHtml(e.message)}</span>`; }
            }

            async function handleWebsite(url) {
                if (!url || !/^https?:\/\//i.test(url)) { 
                    url = prompt('Укажите корректный URL (с https://):', 'https://'); 
                    if (!url) return; 
                }
                openWorkspace('Веб-Сканер'); 
                addMessage('user', renderText(`🌐 Анализ ресурса: ${url}`)); 
                
                const loader = addLoading('Обход защиты CORS и парсинг DOM...');
                try {
                    // Используем бесплатный прокси allorigins
                    const proxyUrl = 'https://api.allorigins.win/raw?url=' + encodeURIComponent(url);
                    const controller = new AbortController(); 
                    const t = setTimeout(() => controller.abort(), 15000);
                    
                    const res = await fetch(proxyUrl, { signal: controller.signal }); 
                    clearTimeout(t);
                    if (!res.ok) throw new Error(`Отказ сервера: ${res.status}`);
                    
                    const html = await res.text(); 
                    const doc = new DOMParser().parseFromString(html, 'text/html');
                    
                    // Вырезаем мусор
                    doc.querySelectorAll('script, style, noscript, svg, img, nav, footer, iframe').forEach(el => el.remove());
                    let textExtracted = (doc.body ? doc.body.innerText : html).replace(/\n{3,}/g, '\n\n').trim().slice(0, 10000); 
                    
                    loader.innerHTML = '<div class="ws-loading"><div class="spinner"></div>Анализ семантики через ИИ...</div>';
                    
                    const prompt = `Сделай профессиональную выжимку этой страницы. Укажи: 1) О чем сайт. 2) Ключевые тезисы. 3) Ценную информацию. Текст сайта:\n\n${textExtracted}`;
                    const answer = await smartAIFetch(prompt);
                    
                    const finalHtml = renderMarkdown(answer);
                    loader.innerHTML = finalHtml; 
                    chats[currentChatId].messages.push({ role: 'assistant', content: answer, html: finalHtml });
                    saveChats();
                } catch (e) { loader.innerHTML = `<span style="color:var(--danger)">⚠️ Сбой подключения: ${escapeHtml(e.message)} (Возможно, сайт блокирует ботов)</span>`; }
            }

            // ==========================================
            // 10. ПАРСИНГ ФАЙЛОВ И ТАБЛИЦ (DATA SCIENCE)
            // ==========================================

            window.triggerFileUpload = function() { document.getElementById('fileInput').click(); }

            document.getElementById('fileInput').addEventListener('change', async function (e) {
                const file = e.target.files[0]; 
                if (!file) return;
                
                const ext = file.name.split('.').pop().toLowerCase(); 
                e.target.value = ''; // Сброс 
                
                const imageExts = ['png', 'jpg', 'jpeg', 'webp'];
                
                if (imageExts.includes(ext) || file.type.startsWith('image/')) {
                    const dataUrl = await new Promise(r => { const reader = new FileReader(); reader.onload = () => r(reader.result); reader.readAsDataURL(file); });
                    setPendingImage(file, dataUrl); 
                    showToast('Фото загружено! Введите команду.');
                } else if (['csv', 'xlsx', 'xls'].includes(ext)) { 
                    await handleSpreadsheet(file);
                } else if (['pdf', 'docx', 'txt', 'md'].includes(ext)) { 
                    await handleDocument(file, ext);
                } else { 
                    showToast('Формат не поддерживается', true); 
                }
            });

            async function handleDocument(file, ext) {
                openWorkspace('Анализатор Документов'); 
                addMessage('user', `📄 Файл: <b>${escapeHtml(file.name)}</b>`);
                const loader = addLoading('Распаковка и чтение...');
                
                try {
                    let content = '';
                    if (ext === 'txt' || ext === 'md') {
                        content = await file.text();
                    } else if (ext === 'pdf') {
                        pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
                        const pdf = await pdfjsLib.getDocument({ data: await file.arrayBuffer() }).promise;
                        for (let i = 1; i <= pdf.numPages && i <= 30; i++) { // Защита от гигантских PDF
                            const pageText = await (await pdf.getPage(i)).getTextContent();
                            content += pageText.items.map(it => it.str).join(' ') + '\n';
                        }
                    } else if (ext === 'docx') {
                        content = (await mammoth.extractRawText({ arrayBuffer: await file.arrayBuffer() })).value;
                    }
                    
                    content = content.trim().slice(0, 15000); 
                    if (!content) throw new Error('Пустой документ или зашифрован');
                    
                    loader.innerHTML = '<div class="ws-loading"><div class="spinner"></div>Извлечение сущностей...</div>';
                    
                    const answer = await smartAIFetch(`Проанализируй документ. Выдели:\n- Основную суть\n- Главные тезисы\n- Важные цифры и выводы\n\nТекст:\n${content}`);
                    const finalHtml = renderMarkdown(answer);
                    
                    loader.innerHTML = finalHtml; 
                    chats[currentChatId].messages.push({ role: 'assistant', content: answer, html: finalHtml });
                    saveChats();
                } catch (e) { loader.innerHTML = `<span style="color:var(--danger)">⚠️ Ошибка чтения: ${escapeHtml(e.message)}</span>`; }
            }

            async function handleSpreadsheet(file) {
                openWorkspace('Data Science Engine');
                addMessage('user', `📊 Датасет: <b>${escapeHtml(file.name)}</b>`);
                const loader = addLoading('Парсинг ячеек и типов данных...');
                
                try {
                    let rows = [];
                    // Чтение формата
                    if (file.name.toLowerCase().endsWith('.csv')) {
                        rows = Papa.parse(await file.text(), { header: true, skipEmptyLines: true, dynamicTyping: true }).data;
                    } else {
                        const wb = XLSX.read(await file.arrayBuffer(), { type: 'array' });
                        rows = XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]], { defval: null });
                    }
                    
                    if (!rows.length) throw new Error('Файл не содержит табличных данных');

                    const columns = Object.keys(rows[0]);
                    const numericCols = columns.filter(c => rows.every(r => typeof r[c] === 'number' || r[c] == null));

                    // Вычисление математической статистики
                    const stats = {};
                    numericCols.forEach(c => {
                        const vals = rows.map(r => r[c]).filter(v => typeof v === 'number');
                        if (!vals.length) return;
                        
                        const sum = vals.reduce((a, b) => a + b, 0);
                        const sorted = [...vals].sort((a, b) => a - b);
                        
                        stats[c] = {
                            count: vals.length, 
                            mean: (sum / vals.length).toFixed(2), 
                            min: sorted[0],
                            max: sorted[sorted.length - 1], 
                            median: sorted[Math.floor(sorted.length / 2)]
                        };
                    });

                    // Генерация UI Таблицы
                    let statsHtml = `<p style="color:var(--text-muted)">Размерность: ${rows.length} строк × ${columns.length} столбцов</p>`;
                    if (Object.keys(stats).length > 0) {
                        statsHtml += `
                        <div style="overflow-x:auto; margin-top:16px;">
                            <table style="width:100%; border-collapse:collapse; background:var(--bg-input); border-radius:8px; overflow:hidden;">
                                <tr style="background:var(--bg-hover);">
                                    <th style="padding:10px; text-align:left; border:1px solid var(--border);">Колонка</th>
                                    <th style="padding:10px; border:1px solid var(--border);">Среднее</th>
                                    <th style="padding:10px; border:1px solid var(--border);">Минимум</th>
                                    <th style="padding:10px; border:1px solid var(--border);">Медиана</th>
                                    <th style="padding:10px; border:1px solid var(--border);">Максимум</th>
                                </tr>`;
                        Object.entries(stats).forEach(([c, s]) => { 
                            statsHtml += `<tr>
                                <td style="padding:10px; border:1px solid var(--border); font-weight:600;">${escapeHtml(c)}</td>
                                <td style="padding:10px; border:1px solid var(--border);">${s.mean}</td>
                                <td style="padding:10px; border:1px solid var(--border);">${s.min}</td>
                                <td style="padding:10px; border:1px solid var(--border);">${s.median}</td>
                                <td style="padding:10px; border:1px solid var(--border);">${s.max}</td>
                            </tr>`; 
                        });
                        statsHtml += '</table></div>';
                    } else {
                        statsHtml += '<p style="color:var(--warning); margin-top:10px;">В таблице нет числовых колонок для глубокого анализа.</p>';
                    }

                    // График K-Means (если есть хотя бы 2 числовые колонки)
                    let chartHtml = '';
                    const canvasId = 'chart_' + Date.now();
                    
                    if (numericCols.length >= 2) {
                        const [cx, cy] = numericCols;
                        const points = rows.map(r => [r[cx], r[cy]]).filter(p => typeof p[0] === 'number' && typeof p[1] === 'number');
                        
                        chartHtml = `
                            <div style="background:#1e1e1e; padding:16px; border-radius:12px; margin-top:24px; border: 1px solid var(--border);">
                                <h4 style="margin-bottom:12px; color:var(--accent-hover);">Кластеризация (Оси: ${escapeHtml(cx)} / ${escapeHtml(cy)})</h4>
                                <canvas id="${canvasId}" height="200"></canvas>
                            </div>
                        `;
                        
                        loader.innerHTML = statsHtml + chartHtml + '<div class="ws-loading" style="margin-top:16px;"><div class="spinner"></div>Анализ аномалий (ИИ)...</div>';
                        
                        // Асинхронно рисуем график после обновления DOM
                        setTimeout(() => {
                            const clusters = calculateKMeans(points, Math.min(3, points.length));
                            renderScatterChart(canvasId, points, clusters, cx, cy);
                        }, 100);
                    } else {
                        loader.innerHTML = statsHtml + '<div class="ws-loading" style="margin-top:16px;"><div class="spinner"></div>Анализ аномалий (ИИ)...</div>';
                    }

                    // ИИ Инсайты
                    const prompt = `Проанализируй эти статистические данные датасета (${rows.length} записей): ${JSON.stringify(stats)}. Выдай 3 бизнес-инсайта маркированным списком.`;
                    const insights = await smartAIFetch(prompt);
                    
                    const finalOutput = `
                        ${statsHtml}
                        ${chartHtml}
                        <h3 style="margin-top:24px; margin-bottom:12px;">Выводы ИИ:</h3>
                        <div class="markdown-body">${renderMarkdown(insights)}</div>
                        <button class="ws-download" style="width:100%; background:var(--success); margin-top:20px;" onclick="exportExcelGlobal()">📊 Скачать отчет (Excel)</button>
                    `;
                    
                    loader.innerHTML = finalOutput;
                    chats[currentChatId].messages.push({ role: 'assistant', content: 'Отчет Data Science', html: finalOutput });
                    saveChats();

                    // Сохраняем глобально для кнопки скачивания
                    window.exportExcelGlobal = () => {
                        const wb = XLSX.utils.book_new();
                        XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(rows), 'Raw Data');
                        
                        const statsArray = Object.entries(stats).map(([col, s]) => ({ 
                            'Показатель': col, 'Среднее': s.mean, 'Мин': s.min, 'Медиана': s.median, 'Макс': s.max 
                        }));
                        XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(statsArray), 'Analytics');
                        XLSX.writeFile(wb, `Quanta_Report_${Date.now()}.xlsx`);
                    };

                } catch (e) { loader.innerHTML = `<span style="color:var(--danger)">⚠️ Сбой датасета: ${escapeHtml(e.message)}</span>`; }
            }

            // Математика K-Means (Кластеризация)
            function calculateKMeans(points, k) {
                let centroids = points.slice(0, k).map(p => [...p]);
                let assignments = new Array(points.length).fill(0);
                
                for (let iter = 0; iter < 15; iter++) {
                    assignments = points.map(p => {
                        let best = 0, bestDist = Infinity;
                        centroids.forEach((c, i) => { 
                            const d = (p[0]-c[0])**2 + (p[1]-c[1])**2; 
                            if(d < bestDist) { bestDist=d; best=i; }
                        });
                        return best;
                    });
                    
                    centroids = centroids.map((c, i) => {
                        const m = points.filter((_, idx) => assignments[idx] === i);
                        return m.length ? [m.reduce((a, p) => a+p[0], 0)/m.length, m.reduce((a, p) => a+p[1], 0)/m.length] : c;
                    });
                }
                return assignments;
            }

            // Отрисовка графиков Chart.js
            function renderScatterChart(canvasId, points, clusters, cx, cy) {
                const canvas = document.getElementById(canvasId); 
                if (!canvas) return;
                
                const colors = ['#8b5cf6', '#10b981', '#f59e0b', '#ef4444', '#06b6d4'];
                const datasets = [...new Set(clusters)].map(cl => ({
                    label: `Кластер ${cl + 1}`,
                    data: points.filter((_, i) => clusters[i] === cl).map(p => ({ x: p[0], y: p[1] })),
                    backgroundColor: colors[cl % colors.length],
                    pointRadius: 6,
                    pointHoverRadius: 9
                }));
                
                new Chart(canvas, {
                    type: 'scatter', 
                    data: { datasets },
                    options: { 
                        responsive: true, 
                        maintainAspectRatio: false,
                        scales: { 
                            x: { title: { display: true, text: cx, color: '#a1a1aa' }, ticks: { color: '#a1a1aa' }, grid: { color: '#27272a' } }, 
                            y: { title: { display: true, text: cy, color: '#a1a1aa' }, ticks: { color: '#a1a1aa' }, grid: { color: '#27272a' } } 
                        }, 
                        plugins: { legend: { labels: { color: '#f4f4f5' } } } 
                    }
                });
            }

        }); // Конец DOMContentLoaded
    </script>
